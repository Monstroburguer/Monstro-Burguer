<body>

<div class="cabecalho">
  <a href="index.html" class="voltar">←</a>
  <h1><span>CARDÁPIO</span></h1>
</div>

<div class="categorias">
  <button class="cat-btn ativo" data-cat="Lanches">🍔 Lanches</button>
  <button class="cat-btn" data-cat="Bebidas">🥤 Bebidas</button>
  <button class="cat-btn" data-cat="Adicionais">➕ Adicionais</button>
  <button class="cat-btn" data-cat="Combos">📦 Combos</button>
</div>

<div class="container" id="cardapio">
  <div class="carregando">Carregando cardápio...</div>
</div>

<div class="carrinho-barra">
  <div class="carrinho-info">
    <div class="carrinho-total" id="carrinho-total">R$ 0,00</div>
    <div class="carrinho-itens" id="carrinho-qtd">Nenhum item selecionado</div>
  </div>
  <button class="btn-finalizar" id="btn-finalizar" onclick="abrirModal()" disabled>
    Finalizar
  </button>
</div>

<div class="modal-fundo" id="modal">
  <div class="modal">
    <button class="fechar-modal" onclick="fecharModal()">×</button>
    <h2>📋 Resumo do Pedido</h2>
    <div id="modal-itens"></div>

    <div class="modal-campo">
      <label>Nome do cliente *</label>
      <input type="text" id="cliente-nome" placeholder="Seu nome completo">
    </div>
    <div class="modal-campo">
      <label>Endereço de entrega *</label>
      <input type="text" id="cliente-endereco" placeholder="Rua, número, bairro">
    </div>
    <div class="modal-campo">
      <label>Forma de pagamento *</label>
      <select id="cliente-pagamento" onchange="alternarCampoTroco()">
        <option value="">Selecione...</option>
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
      </select>
    </div>

    <div class="modal-campo" id="campo-troco" style="display:none">
      <label>Precisa de troco? *</label>
      <select id="cliente-troco" onchange="alternarCampoTrocoValor()">
        <option value="">Selecione...</option>
        <option value="Não preciso de troco">Não preciso de troco</option>
        <option value="Preciso de troco">Preciso de troco</option>
      </select>
    </div>

    <div class="modal-campo" id="campo-troco-valor" style="display:none">
      <label>Troco para quanto? *</label>
      <input type="text" id="cliente-troco-valor" placeholder="Ex: R$ 100,00">
    </div>

    <div class="modal-obs">
      <textarea id="observacao-pedido" placeholder="Observações (ex: retirar cebola, ponto da carne, etc.)"></textarea>
    </div>
    <div class="modal-total" id="modal-total">R$ 0,00</div>
    <div class="modal-botoes">
      <button class="modal-btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn-whatsapp" id="btn-enviar-whatsapp" onclick="enviarWhatsApp()">📱 Enviar Pedido</button>
    </div>
  </div>
</div>

<script>
/* ==================================================
   WHATSAPP DOS PEDIDOS (Firestore: config/loja)
   Começa com o número principal como padrão e é
   atualizado em tempo real se o admin trocar.
================================================== */
let whatsappPedidos = "5514996619487";

/* ==================================================
   STATUS DA LOJA (Firestore: config/loja)
   Mesma lógica do index.html: respeita o status
   forçado pelo admin (aberto/fechado/auto) e,
   em modo automático, considera o horário 19h-24h.
================================================== */
const horaAbertura = 19;
const horaFechamento = 24;
let statusForcado = "auto";
let lojaAberta = true;

function atualizarStatusLoja(){
  if(statusForcado === "aberto"){
    lojaAberta = true;
  } else if(statusForcado === "fechado"){
    lojaAberta = false;
  } else {
    const agora = new Date();
    const hora = agora.getHours();
    const minuto = agora.getMinutes();
    const horarioAtual = hora + (minuto / 60);
    lojaAberta = horarioAtual >= horaAbertura && horarioAtual < horaFechamento;
  }
  atualizarBotaoEnviar();
}

function atualizarBotaoEnviar(){
  const btn = document.getElementById('btn-enviar-whatsapp');
  if(!btn) return;

  if(!lojaAberta){
    btn.disabled = true;
    btn.textContent = '🔒 Loja Fechada';
  } else {
    btn.disabled = false;
    btn.textContent = '📱 Enviar Pedido';
  }
}

atualizarStatusLoja();
setInterval(atualizarStatusLoja, 60000);

db.collection("config").doc("loja").onSnapshot(function(doc) {
  if (doc.exists) {
    const dados = doc.data();

    if (dados.whatsapp) {
      whatsappPedidos = dados.whatsapp;
    }

    statusForcado = dados.statusLoja || "auto";
    atualizarStatusLoja();
  }
});

/* ==================================================
   PRODUTOS (Firestore: coleção "produtos")
================================================== */
let todosProdutos = [];
let carrinho = [];
let categoriaAtiva = 'Lanches';

const nomesCategoria = {
  Lanches: '🍔 Lanches',
  Bebidas: '🥤 Bebidas',
  Adicionais: '➕ Adicionais',
  Combos: '📦 Combos'
};

window.onload = function(){
  // Categoria vinda da tela inicial (index.html), se houver
  const catSalva = sessionStorage.getItem('categoriaInicial');
  if (catSalva && nomesCategoria[catSalva]) {
    categoriaAtiva = catSalva;
    document.querySelectorAll('.cat-btn').forEach(function(b){
      b.classList.toggle('ativo', b.dataset.cat === catSalva);
    });
    sessionStorage.removeItem('categoriaInicial');
  }

  configurarCategorias();

  db.collection("produtos")
    .where("ativo", "==", true)
    .onSnapshot(function(snapshot) {
      todosProdutos = [];
      snapshot.forEach(function(doc) {
        todosProdutos.push(Object.assign({ id: doc.id }, doc.data()));
      });
      renderizarCardapio();
    }, function(erro) {
      document.getElementById('cardapio').innerHTML =
        '<div class="vazio">Não foi possível carregar o cardápio agora. Tente novamente em instantes.</div>';
    });
};

function renderizarCardapio(){
  const container = document.getElementById('cardapio');
  const itens = todosProdutos.filter(function(p){ return p.categoria === categoriaAtiva; });

  const titulo = nomesCategoria[categoriaAtiva] || categoriaAtiva;

  if (itens.length === 0) {
    container.innerHTML =
      '<h3 class="categoria-titulo">' + titulo + '</h3>' +
      '<div class="vazio">Nenhum item cadastrado nessa categoria ainda.</div>';
    atualizarCarrinho();
    return;
  }

  let html = '<h3 class="categoria-titulo">' + titulo + '</h3>';

  itens.forEach(function(item){
    const noCarrinho = carrinho.find(function(i){ return i.id === item.id; });
    const qtd = noCarrinho ? noCarrinho.quantidade : 0;
    const selecionado = qtd > 0;
    const preco = Number(item.preco) || 0;
    const fotoHTML = item.foto ? '<img src="' + item.foto + '" class="item-foto" alt="' + item.nome + '">' : '';

    html += '<div class="item ' + (selecionado ? 'selecionado' : '') + '">' +
        fotoHTML +
        '<div class="item-cima">' +
          '<div class="item-nome">' + item.nome + '</div>' +
          '<div class="item-preco">R$ ' + preco.toFixed(2).replace('.',',') + '</div>' +
        '</div>' +
        '<div class="item-descricao">' + (item.descricao || '') + '</div>' +
        '<div class="item-baixo">' +
          '<button id="btn-sel-' + item.id + '" class="btn-selecionar ' + (selecionado ? 'selecionado' : '') + '" onclick="clicarSelecionar(\'' + item.id + '\')">' +
            (selecionado ? 'Selecionado' : 'Selecionar') +
          '</button>' +
          '<div class="quantidade-controle">' +
            '<button class="qtd-btn menos" onclick="alterarQtd(\'' + item.id + '\', -1)">−</button>' +
            '<span class="qtd-num">' + qtd + '</span>' +
            '<button class="qtd-btn mais" onclick="alterarQtd(\'' + item.id + '\', 1)">+</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  container.innerHTML = html;
  atualizarCarrinho();
}

function configurarCategorias(){
  document.querySelectorAll('.cat-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('ativo'); });
      this.classList.add('ativo');
      categoriaAtiva = this.dataset.cat;
      renderizarCardapio();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function alternarItem(id){
  const item = todosProdutos.find(function(i){ return i.id === id; });
  if (!item) return;
  const noCarrinho = carrinho.find(function(i){ return i.id === id; });

  if(noCarrinho){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  } else {
    carrinho.push({id: item.id, nome: item.nome, preco: Number(item.preco) || 0, quantidade: 1});
  }
  renderizarCardapio();
}

/* ==================================================
   SOM DE CLIQUE (igual ao da tela inicial)
================================================== */
function tocarCliqueSistema() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(1300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.09);

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.11);
  } catch (e) {
    /* Áudio bloqueado pelo navegador, segue sem som */
  }
}

/* ==================================================
   CLIQUE NO BOTÃO SELECIONAR: som + flash neon
   O brilho fica aceso por ~0.65s antes de apagar.
================================================== */
function clicarSelecionar(id){
  tocarCliqueSistema();
  alternarItem(id);

  const btn = document.getElementById('btn-sel-' + id);
  if(btn){
    btn.classList.add('clicado');
    const itemEl = btn.closest('.item');
    if(itemEl){
      itemEl.classList.add('flash-selecionar');
    }
    setTimeout(function(){
      btn.classList.remove('clicado');
      if(itemEl){
        itemEl.classList.remove('flash-selecionar');
      }
    }, 250);
  }
}

function alterarQtd(id, delta){
  const item = carrinho.find(function(i){ return i.id === id; });
  if(!item) return;

  item.quantidade += delta;
  if(item.quantidade <= 0){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  }
  renderizarCardapio();
}

function atualizarCarrinho(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const qtdItens = carrinho.reduce(function(s, i){ return s + i.quantidade; }, 0);

  document.getElementById('carrinho-total').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
  document.getElementById('carrinho-qtd').textContent =
    qtdItens === 0 ? 'Nenhum item selecionado' :
    qtdItens + ' item' + (qtdItens > 1 ? 's' : '') + ' selecionado' + (qtdItens > 1 ? 's' : '');
  document.getElementById('btn-finalizar').disabled = qtdItens === 0;
}

function abrirModal(){
  if(carrinho.length === 0) return;
  const itensDiv = document.getElementById('modal-itens');
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);

  itensDiv.innerHTML = carrinho.map(function(i){
    return '<div class="modal-item"><span>' + i.quantidade + 'x ' + i.nome + '</span>' +
           '<span>R$ ' + (i.preco * i.quantidade).toFixed(2).replace('.',',') + '</span></div>';
  }).join('');

  document.getElementById('modal-total').innerHTML = '<strong>TOTAL: R$ ' + total.toFixed(2).replace('.',',') + '</strong>';
  document.getElementById('campo-troco').style.display = 'none';
  document.getElementById('campo-troco-valor').style.display = 'none';
  document.getElementById('cliente-troco').value = '';
  document.getElementById('cliente-troco-valor').value = '';
  atualizarBotaoEnviar();
  document.getElementById('modal').classList.add('modal-aberto');
}

function fecharModal(){
  document.getElementById('modal').classList.remove('modal-aberto');
}

/* ==================================================
   CAMPO DE TROCO (só aparece quando pagamento = Dinheiro)
================================================== */
function alternarCampoTroco(){
  const pagamento = document.getElementById('cliente-pagamento').value;
  const campoTroco = document.getElementById('campo-troco');
  const campoTrocoValor = document.getElementById('campo-troco-valor');

  if(pagamento === 'Dinheiro'){
    campoTroco.style.display = 'block';
  } else {
    campoTroco.style.display = 'none';
    campoTrocoValor.style.display = 'none';
    document.getElementById('cliente-troco').value = '';
    document.getElementById('cliente-troco-valor').value = '';
  }
}

function alternarCampoTrocoValor(){
  const troco = document.getElementById('cliente-troco').value;
  const campoTrocoValor = document.getElementById('campo-troco-valor');

  if(troco === 'Preciso de troco'){
    campoTrocoValor.style.display = 'block';
  } else {
    campoTrocoValor.style.display = 'none';
    document.getElementById('cliente-troco-valor').value = '';
  }
}

/* ==================================================
   NÚMERO DE PEDIDO SEQUENCIAL (Firestore: config/contadorPedidos)
   Usa transação para garantir número único mesmo se
   dois clientes finalizarem pedido ao mesmo tempo.
================================================== */
function proximoNumeroPedido(){
  const contadorRef = db.collection('config').doc('contadorPedidos');
  return db.runTransaction(function(transaction){
    return transaction.get(contadorRef).then(function(doc){
      let atual = 0;
      if(doc.exists && doc.data().valor){
        atual = doc.data().valor;
      }
      const novo = atual + 1;
      transaction.set(contadorRef, {valor: novo});
      return novo;
    });
  });
}

function enviarWhatsApp(){
  if(carrinho.length === 0) return;

  if(!lojaAberta){
    alert('A loja está fechada no momento. Não é possível enviar pedidos.');
    return;
  }

  const nome = document.getElementById('cliente-nome').value.trim();
  const endereco = document.getElementById('cliente-endereco').value.trim();
  const pagamento = document.getElementById('cliente-pagamento').value;

  if(!nome){
    alert('Por favor, preencha seu nome.');
    return;
  }
  if(!endereco){
    alert('Por favor, preencha o endereço de entrega.');
    return;
  }
  if(!pagamento){
    alert('Por favor, escolha a forma de pagamento.');
    return;
  }

  let trocoInfo = '';
  if(pagamento === 'Dinheiro'){
    const troco = document.getElementById('cliente-troco').value;
    if(!troco){
      alert('Por favor, informe se precisa de troco.');
      return;
    }
    if(troco === 'Preciso de troco'){
      const trocoValor = document.getElementById('cliente-troco-valor').value.trim();
      if(!trocoValor){
        alert('Por favor, informe para quanto precisa de troco.');
        return;
      }
      trocoInfo = 'TROCO PARA: ' + trocoValor;
    } else {
      trocoInfo = 'TROCO: Não precisa';
    }
  }

  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const obs = document.getElementById('observacao-pedido').value.trim();

  const btnEnviar = document.getElementById('btn-enviar-whatsapp');
  btnEnviar.disabled = true;
  btnEnviar.textContent = 'Enviando...';

  proximoNumeroPedido().then(function(numero){
    const numeroFormatado = String(numero).padStart(4, '0');

    let texto = '━━━━━━━━━━━━━━\n';
    texto += '*MONSTRO BURGUER* — Nº ' + numeroFormatado + '\n';
    texto += '━━━━━━━━━━━━━━\n\n';

    texto += 'CLIENTE: ' + nome + '\n';
    texto += 'ENDEREÇO: ' + endereco + '\n';
    texto += 'FORMA DE PAGAMENTO: ' + pagamento + '\n';
    if(trocoInfo){
      texto += trocoInfo + '\n';
    }
    texto += '\n';

    texto += 'ITENS DO PEDIDO:\n';
    carrinho.forEach(function(i){
      const subtotal = (i.preco * i.quantidade).toFixed(2).replace('.',',');
      texto += i.quantidade + 'x ' + i.nome + ' - R$ ' + subtotal + '\n';
    });

    if(obs){
      texto += '\nOBSERVAÇÕES:\n' + obs + '\n';
    }

    texto += '\nTOTAL: R$ ' + total.toFixed(2).replace('.',',') + '\n\n';
    texto += 'Pode me chamar pra confirmar! Obrigado!';

    const url = 'https://wa.me/' + whatsappPedidos + '?text=' + encodeURIComponent(texto);
    window.open(url, '_blank');

    btnEnviar.disabled = false;
    btnEnviar.textContent = '📱 Enviar Pedido';
    fecharModal();
  }).catch(function(erro){
    alert('Não foi possível gerar o número do pedido agora. Tente novamente.');
    btnEnviar.disabled = false;
    btnEnviar.textContent = '📱 Enviar Pedido';
  });
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) fecharModal();
});
</script>
