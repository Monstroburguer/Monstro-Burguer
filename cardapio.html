<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 MONSTRO BURGUER — Cardápio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Rajdhani',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --void: #05070d;
  --ciano: #00e5ff;
  --ciano-dim: rgba(0, 229, 255, 0.35);
  --violeta: #8b2fff;
  --violeta-dim: rgba(139, 47, 255, 0.35);
  --verde: #39ff88;
  --vermelho: #ff3b5c;
  --dourado: #ffc93c;
  --texto: #eaf6ff;
  --card: #0b0f1c;
  --mono: 'JetBrains Mono', monospace;
}
html,body{background:var(--void);color:var(--texto);min-height:100vh}
body{padding-bottom:110px;position:relative}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.06), transparent 45%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 38px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 38px);
}

.cabecalho{
  position:sticky;
  top:0;
  z-index:90;
  text-align:center;
  padding:18px 15px;
  background:rgba(5,7,13,0.92);
  backdrop-filter:blur(6px);
  border-bottom:2px solid var(--ciano);
  box-shadow:0 0 16px rgba(0,229,255,0.35), inset 0 -8px 16px -12px rgba(0,229,255,0.4);
}
.cabecalho h1{
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--texto);
  text-transform:uppercase;
}
.cabecalho h1 span{
  color:var(--ciano);
  text-shadow:0 0 8px var(--ciano), 0 0 20px var(--ciano);
}
.voltar{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  clip-path:polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  border:1.5px solid var(--violeta);
  background:rgba(0,0,0,0.6);
  color:var(--texto);
  text-decoration:none;
  font-size:16px;
  box-shadow:0 0 9px var(--violeta-dim);
}

.categorias{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  padding:14px 15px;
  position:sticky;
  top:63px;
  z-index:80;
  background:var(--void);
  border-bottom:1px solid rgba(0,229,255,0.15);
}
.cat-btn{
  padding:10px 4px;
  background:linear-gradient(135deg, rgba(139,47,255,0.10), rgba(0,229,255,0.04));
  border:1px solid var(--ciano-dim);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  color:rgba(234,246,255,0.55);
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:all .25s;
  text-align:center;
}
.cat-btn.ativo{
  border-color:var(--ciano);
  color:var(--void);
  background:linear-gradient(135deg, var(--ciano), var(--violeta));
  box-shadow:0 0 16px rgba(0,229,255,0.55);
  font-weight:700;
}

.container{padding:0 15px 30px;position:relative;z-index:1}
.categoria-titulo{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--ciano);
  margin:18px 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(0,229,255,0.2);
}
.categoria-titulo::before{content:"// "}

.item{
  background:var(--card);
  clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  padding:16px;
  margin-bottom:12px;
  border:1px solid rgba(0,229,255,0.15);
  transition:all .3s;
}
.item.selecionado{
  border-color:var(--verde);
  box-shadow:0 0 18px rgba(57,255,136,0.35), inset 0 0 14px rgba(57,255,136,0.06);
}
.item-cima{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:8px;
  gap:10px;
}
.item-nome{
  font-size:16px;
  font-weight:700;
  color:var(--texto);
  flex:1;
}
.item-preco{
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
  color:var(--verde);
  text-shadow:0 0 6px rgba(57,255,136,0.5);
  white-space:nowrap;
}
.item.preco-promo .item-preco{
  color:var(--dourado);
  text-shadow:0 0 8px var(--dourado);
  animation:pulsarDourado 1.5s infinite alternate;
}
@keyframes pulsarDourado{
  from{text-shadow:0 0 6px var(--dourado)}
  to{text-shadow:0 0 15px var(--dourado), 0 0 22px var(--dourado)}
}
.item-descricao{
  font-size:13px;
  color:rgba(234,246,255,0.55);
  margin-bottom:12px;
  line-height:1.4;
}
.item-baixo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.btn-selecionar{
  padding:8px 18px;
  background:linear-gradient(135deg, var(--ciano), var(--violeta));
  border:none;
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  color:var(--void);
  font-family:var(--mono);
  font-weight:700;
  font-size:12px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .25s;
  box-shadow:0 0 10px rgba(0,229,255,0.4);
}
.btn-selecionar.selecionado{
  background:linear-gradient(135deg, var(--verde), #00cc66);
  box-shadow:0 0 15px rgba(57,255,136,0.6);
  padding:8px 22px;
}
.btn-selecionar.selecionado::after{content:" ✓"}
.quantidade-controle{
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0;
  transform:scale(0.8);
  transition:all .3s;
}
.item.selecionado .quantidade-controle{opacity:1;transform:scale(1)}
.qtd-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid var(--ciano-dim);
  background:rgba(0,0,0,0.5);
  color:var(--texto);
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.qtd-btn.menos{border-color:var(--vermelho);color:var(--vermelho)}
.qtd-btn.mais{border-color:var(--verde);color:var(--verde)}
.qtd-num{
  font-family:var(--mono);
  font-size:16px;
  font-weight:bold;
  min-width:26px;
  text-align:center;
  color:var(--verde);
}

.carrinho-barra{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(8,10,20,0.95);
  backdrop-filter:blur(6px);
  border-top:2px solid var(--ciano);
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:100;
  box-shadow:0 -6px 20px rgba(0,229,255,0.20);
}
.carrinho-info{flex:1}
.carrinho-total{
  font-family:var(--mono);
  font-size:19px;
  font-weight:700;
  color:var(--verde);
  text-shadow:0 0 8px rgba(57,255,136,0.5);
}
.carrinho-itens{
  font-size:11px;
  font-family:var(--mono);
  color:rgba(234,246,255,0.45);
  margin-top:2px;
}
.btn-finalizar{
  padding:12px 22px;
  background:linear-gradient(135deg, #25D366, #1fb354);
  border:none;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  color:#00150a;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 0 16px rgba(37,211,102,0.55);
  transition:all .2s;
}
.btn-finalizar:active{transform:scale(0.96)}
.btn-finalizar:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}

.modal-fundo{
  position:fixed;
  inset:0;
  background:rgba(2,3,6,0.92);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-aberto{display:flex}
.modal{
  background:var(--card);
  border:1.5px solid var(--ciano);
  clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  padding:25px;
  max-width:380px;
  width:100%;
  box-shadow:0 0 30px rgba(0,229,255,0.35);
  position:relative;
}
.modal h2{
  text-align:center;
  color:var(--ciano);
  margin-bottom:20px;
  font-size:19px;
  letter-spacing:1px;
  text-transform:uppercase;
  text-shadow:0 0 8px rgba(0,229,255,0.5);
}
.modal-item{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(0,229,255,0.12);
  font-size:14px;
  font-family:var(--mono);
}
.modal-obs{margin-top:15px}
.modal-obs textarea{
  width:100%;
  height:60px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--violeta-dim);
  border-radius:8px;
  color:var(--texto);
  padding:10px;
  font-size:13px;
  font-family:'Rajdhani',sans-serif;
  resize:none;
}
.modal-obs textarea:focus{outline:none;border-color:var(--violeta)}
.modal-total{
  display:flex;
  justify-content:space-between;
  padding:15px 0 5px;
  border-top:1px solid var(--verde);
  margin-top:10px;
  font-family:var(--mono);
  font-size:18px;
  font-weight:bold;
  color:var(--verde);
  text-shadow:0 0 6px rgba(57,255,136,0.5);
}
.modal-botoes{display:flex;gap:10px;margin-top:15px}
.modal-btn-cancelar{
  flex:1;
  padding:12px;
  background:transparent;
  border:1px solid rgba(234,246,255,0.3);
  color:rgba(234,246,255,0.7);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  font-size:14px;
  cursor:pointer;
}
.modal-btn-whatsapp{
  flex:2;
  padding:12px;
  background:linear-gradient(135deg, #25D366, #1fb354);
  border:none;
  color:#00150a;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 12px rgba(37,211,102,0.5);
}
.fechar-modal{
  position:absolute;
  top:14px;
  right:14px;
  background:none;
  border:none;
  color:rgba(234,246,255,0.5);
  font-size:24px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="cabecalho">
  <a href="index.html" class="voltar">←</a>
  <h1>🍔 <span>CARDÁPIO</span></h1>
</div>

<div class="categorias">
  <button class="cat-btn ativo" data-cat="lanches">🍔 Lanches</button>
  <button class="cat-btn" data-cat="bebidas">🥤 Bebidas</button>
  <button class="cat-btn" data-cat="adicionais">➕ Adicionais</button>
  <button class="cat-btn" data-cat="combos">📦 Combos</button>
</div>

<div class="container" id="cardapio"></div>

<div class="carrinho-barra">
  <div class="carrinho-info">
    <div class="carrinho-total" id="carrinho-total">R$ 0,00</div>
    <div class="carrinho-itens" id="carrinho-qtd">Nenhum item selecionado</div>
  </div>
  <button class="btn-finalizar" id="btn-finalizar" onclick="abrirModal()" disabled>
    Finalizar
  </button>
</div>

<div class="modal-fundo" id="modal">
  <div class="modal">
    <button class="fechar-modal" onclick="fecharModal()">×</button>
    <h2>📋 Resumo do Pedido</h2>
    <div id="modal-itens"></div>
    <div class="modal-obs">
      <textarea id="observacao-pedido" placeholder="Observações (ex: retirar cebola, ponto da carne, etc.)"></textarea>
    </div>
    <div class="modal-total" id="modal-total">R$ 0,00</div>
    <div class="modal-botoes">
      <button class="modal-btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn-whatsapp" onclick="enviarWhatsApp()">📱 Enviar Pedido</button>
    </div>
  </div>
</div>

<script>
const cardapio = {
  lanches: [
    {id:1, nome:"X-Burguer Monstro", preco:28.00, desc:"Hamburguer artesanal, queijo, alface, tomate, molho especial"},
    {id:2, nome:"X-Catupiry", preco:21.00, desc:"Hamburguer, catupiry, queijo, bacon, molho", promo:true},
    {id:3, nome:"X-Bacon Duplo", preco:34.00, desc:"Dois hamburgueres, bacon em dobro, queijo, molho defumado"},
    {id:4, nome:"X-Tudo Monstro", preco:42.00, desc:"Tudo que temos! Carne, frango, calabresa, bacon, queijo, ovo, salada"},
    {id:5, nome:"X-Salada", preco:25.00, desc:"Hamburguer, queijo, salada fresca"},
    {id:6, nome:"X-Frango", preco:26.00, desc:"File de frango grelhado, queijo, salada, molho de alho"},
    {id:7, nome:"Calabresa Especial", preco:30.00, desc:"Calabresa fatiada, queijo, cebola caramelizada, molho"},
    {id:8, nome:"X-Egg", preco:27.00, desc:"Hamburguer, ovo frito, queijo, bacon, salada"},
    {id:9, nome:"Monstro Duplo", preco:38.00, desc:"Dois hamburgueres artesanais, queijo cheddar, cebola roxa"},
    {id:10, nome:"X-Costela", preco:35.00, desc:"Costela desfiada, queijo, molho barbecue, salada"},
    {id:11, nome:"X-Cheddar Bacon", preco:33.00, desc:"Cheddar cremoso, bacon crocante, hamburguer, molho"},
    {id:12, nome:"Super Monstro", preco:31.00, desc:"Hamburguer gigante, queijo, bacon, ovo, calabresa, salada", promo:true}
  ],
  bebidas: [
    {id:101, nome:"Refrigerante Lata", preco:5.00, desc:"Coca-Cola, Guarana Antarctica, Fanta"},
    {id:102, nome:"Refrigerante 1L", preco:9.00, desc:"Gelado, escolha o sabor"},
    {id:103, nome:"Refrigerante 2L", preco:13.00, desc:"Pra familia toda!"},
    {id:104, nome:"Suco Natural 500ml", preco:8.00, desc:"Laranja, maracuja, caju, goiaba"},
    {id:105, nome:"Suco Natural 1L", preco:14.00, desc:"Fruta fresca, sem acucar"},
    {id:106, nome:"Agua sem gas", preco:3.00, desc:"500ml"},
    {id:107, nome:"Agua com gas", preco:3.50, desc:"500ml"}
  ],
  adicionais: [
    {id:201, nome:"Batata Frita P", preco:8.00, desc:"Crocante e sequinha"},
    {id:202, nome:"Batata Frita M", preco:12.00, desc:"Porcao media"},
    {id:203, nome:"Batata Frita G", preco:16.00, desc:"Porcao familia"},
    {id:204, nome:"Bacon Extra", preco:5.00, desc:"Bacon crocante adicional"},
    {id:205, nome:"Queijo Extra", preco:4.00, desc:"Fatia extra de queijo"},
    {id:206, nome:"Ovo Frito", preco:3.50, desc:"Ovo frito adicional"},
    {id:207, nome:"Catupiry Extra", preco:5.00, desc:"Requeijao cremoso extra"},
    {id:208, nome:"Molho Especial", preco:2.00, desc:"Molho da casa extra"}
  ],
  combos: [
    {id:301, nome:"Combo 1 — X-Burguer + Refri", preco:30.00, desc:"X-Burguer + Refri lata + Batata P"},
    {id:302, nome:"Combo 2 — X-Tudo + Refri", preco:48.00, desc:"X-Tudo + Refri 1L + Batata M"},
    {id:303, nome:"Combo Familia", preco:85.00, desc:"2 X-Tudo + 1 X-Bacon + 2 Refri 1L + Batata G"},
    {id:304, nome:"Combo Duplo", preco:55.00, desc:"2 Lanches a escolher + 2 Refri lata + Batata M"}
  ]
};

let carrinho = [];
let categoriaAtiva = 'lanches';

window.onload = function(){
  // Checa se veio alguma categoria salva na página de início
  const catSalva = localStorage.getItem('categoriaInicial');
  if(catSalva && cardapio[catSalva]){
    categoriaAtiva = catSalva;
    document.querySelectorAll('.cat-btn').forEach(function(b){
      b.classList.toggle('ativo', b.dataset.cat === catSalva);
    });
    localStorage.removeItem('categoriaInicial');
  }
  
  renderizarCardapio();
  configurarCategorias();
};

function renderizarCardapio(){
  const container = document.getElementById('cardapio');
  const itens = cardapio[categoriaAtiva];
  
  const titulo = {
    lanches: '🍔 Lanches',
    bebidas: '🥤 Bebidas',
    adicionais: '➕ Adicionais',
    combos: '📦 Combos'
  }[categoriaAtiva];
  
  let html = '<h3 class="categoria-titulo">' + titulo + '</h3>';
  
  itens.forEach(function(item){
    const noCarrinho = carrinho.find(function(i){ return i.id === item.id; });
    const qtd = noCarrinho ? noCarrinho.quantidade : 0;
    const selecionado = qtd > 0;
    
    html += '<div class="item ' + (selecionado ? 'selecionado' : '') + ' ' + (item.promo ? 'preco-promo' : '') + '">' +
        '<div class="item-cima">' +
          '<div class="item-nome">' + item.nome + (item.promo ? ' 🔥' : '') + '</div>' +
          '<div class="item-preco">R$ ' + item.preco.toFixed(2).replace('.',',') + '</div>' +
        '</div>' +
        '<div class="item-descricao">' + item.desc + '</div>' +
        '<div class="item-baixo">' +
          '<button class="btn-selecionar ' + (selecionado ? 'selecionado' : '') + '" onclick="alternarItem(' + item.id + ')">' + 
            (selecionado ? 'Selecionado' : 'Selecionar') + 
          '</button>' +
          '<div class="quantidade-controle">' +
            '<button class="qtd-btn menos" onclick="alterarQtd(' + item.id + ', -1)">−</button>' +
            '<span class="qtd-num">' + qtd + '</span>' +
            '<button class="qtd-btn mais" onclick="alterarQtd(' + item.id + ', 1)">+</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });
  
  container.innerHTML = html;
  atualizarCarrinho();
}

function configurarCategorias(){
  document.querySelectorAll('.cat-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('ativo'); });
      this.classList.add('ativo');
      categoriaAtiva = this.dataset.cat;
      renderizarCardapio();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function alternarItem(id){
  const item = cardapio[categoriaAtiva].find(function(i){ return i.id === id; });
  const noCarrinho = carrinho.find(function(i){ return i.id === id; });
  
  if(noCarrinho){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  } else {
    carrinho.push({id: item.id, nome: item.nome, preco: item.preco, quantidade: 1});
  }
  renderizarCardapio();
}

function alterarQtd(id, delta){
  const item = carrinho.find(function(i){ return i.id === id; });
  if(!item) return;
  
  item.quantidade += delta;
  if(item.quantidade <= 0){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  }
  renderizarCardapio();
}

function atualizarCarrinho(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const qtdItens = carrinho.reduce(function(s, i){ return s + i.quantidade; }, 0);
  
  document.getElementById('carrinho-total').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
  document.getElementById('carrinho-qtd').textContent = 
    qtdItens === 0 ? 'Nenhum item selecionado' : 
    qtdItens + ' item' + (qtdItens > 1 ? 's' : '') + ' selecionado' + (qtdItens > 1 ? 's' : '');
  document.getElementById('btn-finalizar').disabled = qtdItens === 0;
}

function abrirModal(){
  if(carrinho.length === 0) return;
  const itensDiv = document.getElementById('modal-itens');
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  
  itensDiv.innerHTML = carrinho.map(function(i){
    return '<div class="modal-item"><span>' + i.quantidade + 'x ' + i.nome + '</span>' +
           '<span>R$ ' + (i.preco * i.quantidade).toFixed(2).replace('.',',') + '</span></div>';
  }).join('');
  
  document.getElementById('modal-total').innerHTML = '<strong>TOTAL: R$ ' + total.toFixed(2).replace('.',',') + '</strong>';
  document.getElementById('modal').classList.add('modal-aberto');
}

function fecharModal(){
  document.getElementById('modal').classList.remove('modal-aberto');
}

function enviarWhatsApp(){
  if(carrinho.length === 0) return;
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const obs = document.getElementById('observacao-pedido').value.trim();
  
  let texto = 'PEDIDO - MONSTRO BURGUER\n\nITENS DO PEDIDO:\n';
  
  carrinho.forEach(function(i){
    const subtotal = (i.preco * i.quantidade).toFixed(2).replace('.',',');
    texto += i.quantidade + 'x ' + i.nome + ' - R$ ' + subtotal + '\n';
  });
  
  if(obs){
    texto += '\nOBSERVAÇÕES:\n' + obs + '\n';
  }
  
  texto += '\nTOTAL: R$ ' + total.toFixed(2).replace('.',',') + '\n\n';
  texto += 'Pode me chamar pra confirmar! Obrigado!';
  
  const url = 'https://wa.me/5514996619487?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
  fecharModal();
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) fecharModal();
});
</script>
