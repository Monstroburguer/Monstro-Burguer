<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Rajdhani',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --void: #05070d;
  --ciano: #00e5ff;
  --ciano-dim: rgba(0, 229, 255, 0.35);
  --violeta: #8b2fff;
  --violeta-dim: rgba(139, 47, 255, 0.35);
  --verde: #39ff88;
  --vermelho: #ff3b5c;
  --dourado: #ffc93c;
  --laranja: #ff8c1a;
  --texto: #eaf6ff;
  --card: #0b0f1c;
  --mono: 'JetBrains Mono', monospace;
}
html,body{background:var(--void);color:var(--texto);min-height:100vh}
body{padding-bottom:110px;position:relative}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.06), transparent 45%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 38px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 38px);
}

.cabecalho{
  position:sticky;
  top:0;
  z-index:90;
  text-align:center;
  padding:18px 15px;
  background:rgba(5,7,13,0.92);
  backdrop-filter:blur(6px);
  border-bottom:2px solid var(--ciano);
  box-shadow:0 0 16px rgba(0,229,255,0.35), inset 0 -8px 16px -12px rgba(0,229,255,0.4);
}
.cabecalho h1{
  font-size:24px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--texto);
  text-transform:uppercase;
  animation:pulsarTitulo 3.5s ease-in-out infinite;
}
.cabecalho h1 span{
  color:var(--ciano);
  text-shadow:0 0 8px var(--ciano), 0 0 20px var(--ciano);
}
@keyframes pulsarTitulo{
  0%, 100% { text-shadow:0 0 6px rgba(0,229,255,0.25); }
  50% { text-shadow:0 0 16px rgba(0,229,255,0.55), 0 0 28px rgba(139,47,255,0.25); }
}
.voltar{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  clip-path:polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  border:1.5px solid var(--violeta);
  background:rgba(0,0,0,0.6);
  color:var(--texto);
  text-decoration:none;
  font-size:16px;
  box-shadow:0 0 9px var(--violeta-dim);
}

.categorias{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  padding:14px 15px;
  position:sticky;
  top:63px;
  z-index:80;
  background:var(--void);
  border-bottom:1px solid rgba(0,229,255,0.15);
}
.cat-btn{
  padding:10px 4px;
  background:linear-gradient(135deg, rgba(139,47,255,0.10), rgba(0,229,255,0.04));
  border:1px solid var(--ciano-dim);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  color:rgba(234,246,255,0.55);
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:all .25s;
  text-align:center;
}
.cat-btn.ativo{
  border-color:var(--ciano);
  color:var(--void);
  background:linear-gradient(135deg, var(--ciano), var(--violeta));
  box-shadow:0 0 16px rgba(0,229,255,0.55);
  font-weight:700;
}
.cat-btn.clicado{
  background:linear-gradient(135deg, var(--violeta), #c084ff) !important;
  color:#fff !important;
  border-color:#c084ff !important;
  box-shadow:
    0 0 22px rgba(139,47,255,1),

}

.container{padding:0 15px 30px;position:relative;z-index:1}
.categoria-titulo{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:2px;

.categoria-titulo::before{content:"// "}

.carregando,.vazio{

}

.item{

}
.item.selecionado{

}
.item.promocao.selecionado{

}
.item-preco.promocao{

  text-shadow:0 0 8px rgba(255,140,26,0.9) !important;
}
.item-foto{

}
.item-cima{

  margin-bottom:8px;
  gap:10px;
}
.item-nome{
  font-size:16px;

  color:var(--texto);

}
.item-preco{
  font-family:var(--mono);
  font-size:15px;

}
.item-descricao{
  font-size:13px;

}
.item-baixo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.btn-selecionar{
  padding:8px 18px;
  background:linear-gradient(135deg, var(--ciano), var(--violeta));
  border:none;
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  color:var(--void);
  font-family:var(--mono);
  font-weight:700;
  font-size:12px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .25s;
  box-shadow:0 0 10px rgba(0,229,255,0.4);
}
.btn-selecionar.selecionado{
  background:linear-gradient(135deg, var(--violeta), #c084ff);
  box-shadow:0 0 15px rgba(139,47,255,0.65);
  padding:8px 22px;
}
.btn-selecionar.selecionado::after{content:" ✓"}
.btn-selecionar.flash-roxo{
  background:linear-gradient(135deg, var(--violeta), #c084ff) !important;
  color:#fff !important;
  box-shadow:
    0 0 22px rgba(139,47,255,1),
    0 0 40px rgba(139,47,255,0.75) !important;
  transition:all .06s ease-out;
}
.item.flash-roxo{
  border-color:#c084ff !important;
  box-shadow:
    0 0 22px rgba(139,47,255,0.9),
    inset 0 0 18px rgba(139,47,255,0.25) !important;
  transition:all .06s ease-out;
}
.quantidade-controle{
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0;
  transform:scale(0.8);
  transition:all .3s;
}
.item.selecionado .quantidade-controle{opacity:1;transform:scale(1)}
.qtd-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid var(--ciano-dim);
  background:rgba(0,0,0,0.5);
  color:var(--texto);
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.qtd-btn.menos{border-color:var(--vermelho);color:var(--vermelho)}
.qtd-btn.mais{border-color:var(--verde);color:var(--verde)}
.qtd-num{
  font-family:var(--mono);
  font-size:16px;
  font-weight:bold;
  min-width:26px;
  text-align:center;
  color:var(--verde);
}

.carrinho-barra{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(8,10,20,0.95);
  backdrop-filter:blur(6px);
  border-top:2px solid var(--ciano);
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:100;
  box-shadow:0 -6px 20px rgba(0,229,255,0.20);
}
.carrinho-info{flex:1}
.carrinho-total{
  font-family:var(--mono);
  font-size:19px;
  font-weight:700;
  color:var(--violeta);
  text-shadow:0 0 8px rgba(139,47,255,0.6);
}
.carrinho-itens{
  font-size:11px;
  font-family:var(--mono);
  color:rgba(234,246,255,0.45);
  margin-top:2px;
}
.btn-finalizar{
  padding:12px 22px;
  background:linear-gradient(135deg, #25D366, #1fb354);
  border:none;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  color:#00150a;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 0 16px rgba(37,211,102,0.55);
  transition:all .2s;
}
.btn-finalizar:active{transform:scale(0.96)}
.btn-finalizar:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}

.modal-fundo{
  position:fixed;
  inset:0;
  background:rgba(2,3,6,0.92);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-aberto{display:flex}
.modal{
  background:var(--card);
  border:1.5px solid var(--ciano);

  width:100%;

  overflow-y:auto;
  box-shadow:0 0 30px rgba(0,229,255,0.35);

.modal h2{
  text-align:center;
  color:var(--ciano);
  margin-bottom:20px;
  font-size:19px;

.modal-item{
  display:flex;
  justify-content:space-between;

}
.modal-campo{margin-top:14px}
.modal-campo label{
  display:block;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:rgba(234,246,255,0.55);
  margin-bottom:6px;
}
.modal-campo input,
.modal-campo select{
  width:100%;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--violeta-dim);

  font-family:'Rajdhani',sans-serif;
}
.modal-campo input:focus,
.modal-campo select:focus{outline:none;border-color:var(--violeta)}
.modal-campo select{appearance:none;-webkit-appearance:none}
.modal-obs{margin-top:14px}
.modal-obs textarea{
  width:100%;
  height:60px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--violeta-dim);
  border-radius:8px;
  color:var(--texto);
  padding:10px;
  font-size:13px;
  font-family:'Rajdhani',sans-serif;
  resize:none;
}
.modal-obs textarea:focus{outline:none;border-color:var(--violeta)}
#pix-codigo{
  width:100%;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--violeta-dim);
  border-radius:8px;
  color:var(--texto);
  padding:10px;
  font-size:11px;
  font-family:var(--mono);
  resize:none;
}
.modal-total{
  display:flex;
  justify-content:space-between;
  padding:15px 0 5px;
  border-top:1px solid var(--violeta);
  margin-top:10px;
  font-family:var(--mono);
  font-size:18px;
  font-weight:bold;
  color:var(--violeta);
  text-shadow:0 0 6px rgba(139,47,255,0.6);
}
.modal-botoes{display:flex;gap:10px;margin-top:15px}
.modal-btn-cancelar{
  flex:1;
  padding:12px;
  background:transparent;
  border:1px solid rgba(234,246,255,0.3);
  color:rgba(234,246,255,0.7);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  font-size:14px;
  cursor:pointer;
}
.modal-btn-whatsapp{
  flex:2;
  padding:12px;
  background:linear-gradient(135deg, #25D366, #1fb354);
  border:none;
  color:#00150a;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  font-size:14px;
  font-weight:800;

}

.fechar-modal{

  border-radius:8px;

  font-family:var(--mono);
  font-size:12px;

}

/* ==================================================
   ACOMPANHAMENTO DO PEDIDO (status ao vivo via Firestore)
================================================== */
.acompanhar-pedido{
  position:fixed;
  left:15px;
  right:15px;
  bottom:78px;
  z-index:99;
  background:var(--card);
  border:1.5px solid var(--ciano);
  clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  padding:12px 14px;
  box-shadow:0 0 18px rgba(0,229,255,0.35);
  display:none;
  font-family:var(--mono);
  font-size:12px;
}
.acompanhar-pedido.mostrar{display:block}
.acompanhar-pedido.aceito{
  border-color:var(--verde);
  box-shadow:0 0 18px rgba(57,255,136,0.4);
}
.acompanhar-titulo{
  font-weight:700;
  letter-spacing:0.5px;
  margin-bottom:4px;
}
.acompanhar-pedido.aceito .acompanhar-titulo{color:var(--verde)}
.acompanhar-pedido:not(.aceito) .acompanhar-titulo{color:var(--dourado)}
.acompanhar-detalhe{color:rgba(234,246,255,0.65);line-height:1.5}
.acompanhar-fechar{
  position:absolute;
  top:8px;
  right:10px;
  background:none;
  border:none;
  color:rgba(234,246,255,0.5);
  font-size:16px;
  cursor:pointer;

<body>

<div class="cabecalho">
  <a href="index.html" class="voltar">←</a>
  <h1><span>CARDÁPIO</span></h1>
</div>

<div class="categorias">
  <button class="cat-btn ativo" data-cat="Lanches">🍔 Lanches</button>
  <button class="cat-btn" data-cat="Bebidas">🥤 Bebidas</button>
  <button class="cat-btn" data-cat="Adicionais">➕ Adicionais</button>
  <button class="cat-btn" data-cat="Combos">📦 Combos</button>
</div>

<div class="container" id="cardapio">
  <div class="carregando">Carregando cardápio...</div>
</div>

<div class="acompanhar-pedido" id="acompanharPedido">
  <button class="acompanhar-fechar" onclick="fecharAcompanhamento()">×</button>
  <div class="acompanhar-titulo" id="acompanharTitulo">🕒 Pedido enviado</div>
  <div class="acompanhar-detalhe" id="acompanharDetalhe">Aguardando confirmação da loja...</div>
</div>

<div class="carrinho-barra">
  <div class="carrinho-info">
    <div class="carrinho-total" id="carrinho-total">R$ 0,00</div>
    <div class="carrinho-itens" id="carrinho-qtd">Nenhum item selecionado</div>
  </div>
  <button class="btn-finalizar" id="btn-finalizar" onclick="abrirModal()" disabled>
    Finalizar
  </button>
</div>

<div class="modal-fundo" id="modal">
  <div class="modal">
    <button class="fechar-modal" onclick="fecharModal()">×</button>
    <h2>📋 Resumo do Pedido</h2>
    <div id="modal-itens"></div>

    <div class="modal-campo">
      <label>Nome do cliente *</label>
      <input type="text" id="cliente-nome" placeholder="Seu nome completo">
    </div>
    <div class="modal-campo">
      <label>Tipo de pedido *</label>
      <select id="cliente-tipo-pedido" onchange="alternarTipoPedido()">
        <option value="">Selecione...</option>
        <option value="Entrega">🚚 Entrega</option>
        <option value="Retirada">🏠 Retirada no local</option>
      </select>
    </div>
    <div class="modal-campo" id="aviso-entrega-minima" style="display:none">
      <label style="color:var(--laranja)">⚠️ Pedido mínimo para entrega: R$ 20,00. Esse pedido só pode ser retirado no local.</label>
    </div>

    <div class="modal-campo" id="campo-endereco">
      <label>Endereço de entrega *</label>
      <div class="cidade-fixa">📍 Cidade: Ourinhos - SP</div>
      <input type="text" id="cliente-endereco" placeholder="Rua, número, bairro" onblur="calcularFreteEntrega()">
      <div class="info-frete" id="info-frete"></div>
    </div>
    <div class="modal-campo">
      <label>Forma de pagamento *</label>
      <select id="cliente-pagamento" onchange="alternarCampoPagamento()">
        <option value="">Selecione...</option>
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
      </select>
    </div>

    <div class="modal-campo" id="campo-troco" style="display:none">
      <label>Precisa de troco? *</label>
      <select id="cliente-troco" onchange="alternarCampoTrocoValor()">
        <option value="">Selecione...</option>
        <option value="Não preciso de troco">Não preciso de troco</option>
        <option value="Preciso de troco">Preciso de troco</option>
      </select>
    </div>

    <div class="modal-campo" id="campo-troco-valor" style="display:none">
      <label>Troco para quanto? *</label>
      <input type="text" id="cliente-troco-valor" placeholder="Ex: R$ 100,00">
    </div>

    <div class="modal-campo" id="campo-pix" style="display:none">
      <label>Código Pix Copia e Cola</label>
      <textarea id="pix-codigo" readonly rows="3"></textarea>
      <button type="button" class="modal-btn-cancelar" style="margin-top:8px;width:100%" onclick="copiarCodigoPix()">📋 Copiar código Pix</button>
    </div>

    <div class="modal-obs">
      <textarea id="observacao-pedido" placeholder="Observações (ex: retirar cebola, ponto da carne, etc.)"></textarea>
    </div>
    <div class="modal-total" id="modal-total">R$ 0,00</div>
    <div class="modal-botoes">
      <button class="modal-btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn-whatsapp" id="btn-enviar-whatsapp" onclick="enviarWhatsApp()">📱 Enviar Pedido</button>
    </div>
  </div>
</div>

<script>
/* ==================================================
   WHATSAPP + STATUS DA LOJA (Firestore: config/loja)
   Usa a mesma lógica do index.html (horário automático
   + status forçado pelo admin), pra travar o envio de
   pedido quando a loja estiver fechada, mesmo que o
   cliente entre direto no cardápio sem passar pela home.
================================================== */
let whatsappPedidos = "5514996619487";

const horaAbertura = 19;
const horaFechamento = 24;

let statusForcado = "auto";
let lojaFechada = false;

function calcularLojaFechada(){
  if(statusForcado === "aberto"){
    lojaFechada = false;
    return;
  }
  if(statusForcado === "fechado"){
    lojaFechada = true;
    return;
  }

  const agora = new Date();
  const horarioAtual = agora.getHours() + (agora.getMinutes() / 60);
  const aberto = horarioAtual >= horaAbertura && horarioAtual < horaFechamento;
  lojaFechada = !aberto;
}

calcularLojaFechada();
setInterval(calcularLojaFechada, 60000);

db.collection("config").doc("loja").onSnapshot(function(doc) {
  if (doc.exists) {
    const dados = doc.data();

    if (dados.whatsapp) {
      whatsappPedidos = dados.whatsapp;
    }

    statusForcado = dados.statusLoja || "auto";
    calcularLojaFechada();
  }
});

/* ==================================================
   FRETE AUTOMÁTICO (OpenRouteService)
   Cidade travada como "Ourinhos - SP": o cliente só
   digita rua/número/bairro. O texto vai para a busca
   estruturada da API já fixando locality/region/country,
   e o endereço só é aceito se o RESULTADO retornado pela
   API confirmar que ficou dentro de Ourinhos - SP (nunca
   pelo texto digitado). O frete é calculado pela distância
   real entre a loja e o endereço do cliente:
   R$ 5,00 (base) + R$ 1,50 por km.
================================================== */
const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjNhNWJmMDc0NThiMzRhNmU5MTg4ZDRkODM0Y2ZhZThhIiwiaCI6Im11cm11cjY0In0=";
const ORIGEM_LOJA = { lat: -22.944301, lng: -49.8857998 }; // Monstro Burguer
const FRETE_BASE = 5.00;
const FRETE_POR_KM = 1.50;
const CIDADE_ENTREGA = 'Ourinhos';
const REGIAO_ENTREGA = 'São Paulo';

let freteCalculado = null;
let calculandoFrete = false;

function normalizarTexto(texto){
  return (texto || '')
    .toString()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

async function geocodificarEndereco(enderecoRua){
  const url = 'https://api.openrouteservice.org/geocode/search/structured'
    + '?api_key=' + ORS_API_KEY
    + '&address=' + encodeURIComponent(enderecoRua)
    + '&locality=' + encodeURIComponent(CIDADE_ENTREGA)
    + '&region=' + encodeURIComponent(REGIAO_ENTREGA)
    + '&country=BR';

  const resposta = await fetch(url);
  const dados = await resposta.json();

  if(!dados.features || dados.features.length === 0){
    throw new Error('nao_encontrado');
  }

  const resultado = dados.features[0];
  const props = resultado.properties || {};

  // Validação pelo RESULTADO real devolvido pela API (não pelo texto digitado):
  // confere se o local que a API encontrou de fato fica em Ourinhos - SP.
  const localidadeRetornada = normalizarTexto(props.locality || props.county || '');
  const regiaoRetornada = normalizarTexto(props.region || props.region_a || '');

  const localidadeValida = localidadeRetornada.includes(normalizarTexto(CIDADE_ENTREGA));
  const regiaoValida = regiaoRetornada.includes('sao paulo') || regiaoRetornada === 'sp';

  if(!localidadeValida || !regiaoValida){
    throw new Error('fora_da_cidade');
  }

  const coordenadas = resultado.geometry.coordinates;
  return { lat: coordenadas[1], lng: coordenadas[0] };
}

async function calcularDistanciaKm(destino){
  const url = 'https://api.openrouteservice.org/v2/directions/driving-car?api_key=' + ORS_API_KEY +
    '&start=' + ORIGEM_LOJA.lng + ',' + ORIGEM_LOJA.lat +
    '&end=' + destino.lng + ',' + destino.lat;

  const resposta = await fetch(url);
  const dados = await resposta.json();

  const metros = dados.features[0].properties.summary.distance;
  return metros / 1000;
}

function calcularValorFrete(distanciaKm){
  const valor = FRETE_BASE + (distanciaKm * FRETE_POR_KM);
  return Math.round(valor * 100) / 100;
}

async function calcularFreteEntrega(){
  const tipoPedido = document.getElementById('cliente-tipo-pedido').value;
  if(tipoPedido !== 'Entrega') return;

  const endereco = document.getElementById('cliente-endereco').value.trim();
  const infoFrete = document.getElementById('info-frete');

  if(!endereco){
    freteCalculado = null;
    infoFrete.textContent = '';
    atualizarTotalModal();
    return;
  }

  calculandoFrete = true;
  freteCalculado = null;
  infoFrete.style.color = 'rgba(234,246,255,0.55)';
  infoFrete.textContent = 'Calculando frete...';
  atualizarTotalModal();

  try{
    const destino = await geocodificarEndereco(endereco);
    const distanciaKm = await calcularDistanciaKm(destino);
    const valorFrete = calcularValorFrete(distanciaKm);

    freteCalculado = valorFrete;
    infoFrete.style.color = 'var(--verde)';
    infoFrete.textContent = 'Frete: R$ ' + valorFrete.toFixed(2).replace('.',',') + ' (' + distanciaKm.toFixed(1).replace('.',',') + ' km)';
  } catch(erro){
    freteCalculado = null;
    infoFrete.style.color = 'var(--vermelho)';

    if(erro && erro.message === 'fora_da_cidade'){
      infoFrete.textContent = '⚠️ Esse endereço não foi confirmado em Ourinhos - SP. Confira a rua/bairro digitados.';
    } else {
      infoFrete.textContent = 'Não foi possível calcular o frete. Verifique o endereço.';
    }
  }

  calculandoFrete = false;
  atualizarTotalModal();
}

function atualizarTotalModal(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const tipoPedido = document.getElementById('cliente-tipo-pedido').value;
  const modalTotal = document.getElementById('modal-total');

  if(tipoPedido === 'Entrega' && freteCalculado !== null){
    const totalComFrete = total + freteCalculado;
    modalTotal.innerHTML = '<strong>TOTAL: R$ ' + totalComFrete.toFixed(2).replace('.',',') +
      ' (produtos R$ ' + total.toFixed(2).replace('.',',') + ' + frete R$ ' + freteCalculado.toFixed(2).replace('.',',') + ')</strong>';
  } else {
    modalTotal.innerHTML = '<strong>TOTAL: R$ ' + total.toFixed(2).replace('.',',') + '</strong>';
  }
}

/* ==================================================
   PRODUTOS (Firestore: coleção "produtos")
================================================== */
let todosProdutos = [];
let carrinho = [];
let categoriaAtiva = 'Lanches';

const nomesCategoria = {
  Lanches: '🍔 Lanches',
  Bebidas: '🥤 Bebidas',
  Adicionais: '➕ Adicionais',
  Combos: '📦 Combos'
};

window.onload = function(){
  // Categoria vinda da tela inicial (index.html), se houver
  const catSalva = sessionStorage.getItem('categoriaInicial');
  if (catSalva && nomesCategoria[catSalva]) {
    categoriaAtiva = catSalva;
    document.querySelectorAll('.cat-btn').forEach(function(b){
      b.classList.toggle('ativo', b.dataset.cat === catSalva);
    });
    sessionStorage.removeItem('categoriaInicial');
  }

  configurarCategorias();
  retomarAcompanhamentoPedido();

  db.collection("produtos")
    .where("ativo", "==", true)
    .onSnapshot(function(snapshot) {
      todosProdutos = [];
      snapshot.forEach(function(doc) {
        todosProdutos.push(Object.assign({ id: doc.id }, doc.data()));
      });
      renderizarCardapio();
    }, function(erro) {
      document.getElementById('cardapio').innerHTML =
        '<div class="vazio">Não foi possível carregar o cardápio agora. Tente novamente em instantes.</div>';
    });
};

function renderizarCardapio(){
  const container = document.getElementById('cardapio');
  const itens = todosProdutos.filter(function(p){ return p.categoria === categoriaAtiva; });

  const titulo = nomesCategoria[categoriaAtiva] || categoriaAtiva;

  if (itens.length === 0) {
    container.innerHTML =
      '<h3 class="categoria-titulo">' + titulo + '</h3>' +
      '<div class="vazio">Nenhum item cadastrado nessa categoria ainda.</div>';
    atualizarCarrinho();
    return;
  }

  let html = '<h3 class="categoria-titulo">' + titulo + '</h3>';

  itens.forEach(function(item){
    const noCarrinho = carrinho.find(function(i){ return i.id === item.id; });
    const qtd = noCarrinho ? noCarrinho.quantidade : 0;
    const selecionado = qtd > 0;
    const emPromocao = !!item.promocao;
    const preco = Number(item.preco) || 0;
    const fotoHTML = item.foto ? '<img src="' + item.foto + '" class="item-foto" alt="' + item.nome + '">' : '';

    html += '<div class="item ' + (selecionado ? 'selecionado' : '') + (emPromocao ? ' promocao' : '') + '">' +
        fotoHTML +
        '<div class="item-cima">' +
          '<div class="item-nome">' + item.nome + '</div>' +
          '<div class="item-preco' + (emPromocao ? ' promocao' : '') + '">' + (emPromocao ? '🔥 ' : '') + 'R$ ' + preco.toFixed(2).replace('.',',') + '</div>' +
        '</div>' +
        '<div class="item-descricao">' + (item.descricao || '') + '</div>' +
        '<div class="item-baixo">' +
          '<button class="btn-selecionar ' + (selecionado ? 'selecionado' : '') + '" onclick="flashSelecionar(this, \'' + item.id + '\')">' +
            (selecionado ? 'Selecionado' : 'Selecionar') +
          '</button>' +
          '<div class="quantidade-controle">' +
            '<button class="qtd-btn menos" onclick="alterarQtd(\'' + item.id + '\', -1)">−</button>' +
            '<span class="qtd-num">' + qtd + '</span>' +
            '<button class="qtd-btn mais" onclick="alterarQtd(\'' + item.id + '\', 1)">+</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  container.innerHTML = html;
  atualizarCarrinho();
}

function tocarCliqueSistema() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(1300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.09);

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.11);
  } catch (e) {
    /* Áudio bloqueado pelo navegador, segue sem som */
  }
}

function configurarCategorias(){
  document.querySelectorAll('.cat-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const el = this;

      tocarCliqueSistema();
      el.classList.add('clicado');

      setTimeout(function(){
        el.classList.remove('clicado');

        document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('ativo'); });
        el.classList.add('ativo');
        categoriaAtiva = el.dataset.cat;
        renderizarCardapio();
        window.scrollTo({top:0, behavior:'smooth'});
      }, 140);
    });
  });
}

function flashSelecionar(botao, id){
  tocarCliqueSistema();

  botao.classList.add('flash-roxo');
  const card = botao.closest('.item');
  if(card) card.classList.add('flash-roxo');

  setTimeout(function(){
    botao.classList.remove('flash-roxo');
    if(card) card.classList.remove('flash-roxo');
    alternarItem(id);
  }, 140);
}

function alternarItem(id){
  const item = todosProdutos.find(function(i){ return i.id === id; });
  if (!item) return;
  const noCarrinho = carrinho.find(function(i){ return i.id === id; });

  if(noCarrinho){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  } else {
    carrinho.push({id: item.id, nome: item.nome, preco: Number(item.preco) || 0, quantidade: 1});
  }
  renderizarCardapio();
}

function alterarQtd(id, delta){
  const item = carrinho.find(function(i){ return i.id === id; });
  if(!item) return;

  item.quantidade += delta;
  if(item.quantidade <= 0){
    carrinho = carrinho.filter(function(i){ return i.id !== id; });
  }
  renderizarCardapio();
}

function atualizarCarrinho(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const qtdItens = carrinho.reduce(function(s, i){ return s + i.quantidade; }, 0);

  document.getElementById('carrinho-total').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
  document.getElementById('carrinho-qtd').textContent =
    qtdItens === 0 ? 'Nenhum item selecionado' :
    qtdItens + ' item' + (qtdItens > 1 ? 's' : '') + ' selecionado' + (qtdItens > 1 ? 's' : '');
  document.getElementById('btn-finalizar').disabled = qtdItens === 0;
}

function abrirModal(){
  if(carrinho.length === 0) return;
  const itensDiv = document.getElementById('modal-itens');

  itensDiv.innerHTML = carrinho.map(function(i){
    return '<div class="modal-item"><span>' + i.quantidade + 'x ' + i.nome + '</span>' +
           '<span>R$ ' + (i.preco * i.quantidade).toFixed(2).replace('.',',') + '</span></div>';
  }).join('');

  document.getElementById('campo-troco').style.display = 'none';
  document.getElementById('campo-troco-valor').style.display = 'none';
  document.getElementById('cliente-troco').value = '';
  document.getElementById('cliente-troco-valor').value = '';
  document.getElementById('campo-pix').style.display = 'none';
  document.getElementById('pix-codigo').value = '';
  document.getElementById('cliente-tipo-pedido').value = '';
  document.getElementById('cliente-endereco').value = '';
  document.getElementById('aviso-entrega-minima').style.display = 'none';
  document.getElementById('campo-endereco').style.display = 'block';
  document.getElementById('info-frete').textContent = '';

  freteCalculado = null;
  calculandoFrete = false;

  atualizarOpcaoEntrega();
  atualizarTotalModal();
  document.getElementById('modal').classList.add('modal-aberto');
}

function fecharModal(){
  document.getElementById('modal').classList.remove('modal-aberto');
}

/* ==================================================
   TIPO DE PEDIDO (Entrega / Retirada no local)
   Valor mínimo para entrega: R$ 20,00
================================================== */
const VALOR_MINIMO_ENTREGA = 20;

function atualizarOpcaoEntrega(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const selectTipo = document.getElementById('cliente-tipo-pedido');
  const opcaoEntrega = selectTipo.querySelector('option[value="Entrega"]');
  const aviso = document.getElementById('aviso-entrega-minima');

  if(total < VALOR_MINIMO_ENTREGA){
    opcaoEntrega.disabled = true;
    aviso.style.display = 'block';

    if(selectTipo.value === 'Entrega'){
      selectTipo.value = 'Retirada';
    }
  } else {
    opcaoEntrega.disabled = false;
    aviso.style.display = 'none';

  alternarTipoPedido();

function alternarTipoPedido(){
  const tipo = document.getElementById('cliente-tipo-pedido').value;
  const campoEndereco = document.getElementById('campo-endereco');

  if(tipo === 'Retirada'){
    campoEndereco.style.display = 'none';
    document.getElementById('cliente-endereco').value = '';
    document.getElementById('info-frete').textContent = '';
    freteCalculado = null;
  } else {
    campoEndereco.style.display = 'block';
    const endereco = document.getElementById('cliente-endereco').value.trim();
    if(endereco){
      calcularFreteEntrega();
    }
  }

  atualizarTotalModal();
}

   CAMPO DE TROCO (só aparece quando pagamento = Dinheiro)

/* ==================================================
   CÓDIGO PIX COPIA E COLA (padrão BR Code / EMV)
   Chave Pix: CNPJ 67.672.694/0001-84
   Beneficiário: Monstro Burguer — Ourinhos/SP
================================================== */
function montarCampoPix(id, valor){
  const tamanho = String(valor.length).padStart(2, '0');
  return id + tamanho + valor;
}

function crc16Pix(str){
  let crc = 0xFFFF;
  for(let i = 0; i < str.length; i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(let j = 0; j < 8; j++){
      if((crc & 0x8000) !== 0){
        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      } else {
        crc = (crc << 1) & 0xFFFF;
      }
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}

function gerarPayloadPix(valor){
  const chave = '67672694000184';
  const nomeRecebedor = 'MONSTRO BURGUER';
  const cidade = 'OURINHOS';
  const valorFormatado = valor.toFixed(2);

  const gui = montarCampoPix('00', 'br.gov.bcb.pix');
  const chaveCampo = montarCampoPix('01', chave);
  const merchantAccountInfo = montarCampoPix('26', gui + chaveCampo);

  const payloadSemCrc =
    montarCampoPix('00', '01') +
    merchantAccountInfo +
    montarCampoPix('52', '0000') +
    montarCampoPix('53', '986') +
    montarCampoPix('54', valorFormatado) +
    montarCampoPix('58', 'BR') +
    montarCampoPix('59', nomeRecebedor) +
    montarCampoPix('60', cidade) +
    montarCampoPix('62', montarCampoPix('05', '***')) +
    '6304';

  return payloadSemCrc + crc16Pix(payloadSemCrc);
}

function gerarCodigoPix(){
  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  document.getElementById('pix-codigo').value = gerarPayloadPix(total);
}

function copiarCodigoPix(){
  const campo = document.getElementById('pix-codigo');
  campo.select();
  campo.setSelectionRange(0, 99999);

  try{
    navigator.clipboard.writeText(campo.value);
  } catch(e){
    document.execCommand('copy');
  }

  alert('Código Pix copiado!');
}

/* ==================================================
   NÚMERO DE PEDIDO SEQUENCIAL (Firestore: config/contadorPedidos)
   Usa transação para garantir número único mesmo se
   dois clientes finalizarem pedido ao mesmo tempo.
================================================== */
function proximoNumeroPedido(){
  const contadorRef = db.collection('config').doc('contadorPedidos');
  return db.runTransaction(function(transaction){
    return transaction.get(contadorRef).then(function(doc){
      let atual = 0;
      if(doc.exists && doc.data().valor){
        atual = doc.data().valor;
      }
      const novo = atual + 1;
      transaction.set(contadorRef, {valor: novo});
      return novo;
    });
  });
}

/* ==================================================
   PEDIDOS (Firestore: coleção "pedidos")
   Salva o pedido pra loja poder aceitar (com o frete já
   calculado automaticamente, quando for entrega) e o
   cliente acompanhar o status ao vivo aqui na mesma página.
================================================== */
const pedidosRef = db.collection('pedidos');
let pedidoAtualId = null;
let pedidoAtualUnsub = null;

function salvarPedidoFirestore(numeroFormatado, dados){
  return pedidosRef.doc(numeroFormatado).set(Object.assign({
    numero: numeroFormatado,
    status: 'pendente',
    frete: null,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }, dados));
}

function acompanharPedido(id){
  pedidoAtualId = id;
  sessionStorage.setItem('pedidoAcompanhado', id);

  if(pedidoAtualUnsub){
    pedidoAtualUnsub();
  }

  pedidoAtualUnsub = pedidosRef.doc(id).onSnapshot(function(doc){
    if(!doc.exists) return;
    atualizarPainelAcompanhamento(doc.data());
  });
}

function retomarAcompanhamentoPedido(){
  const idSalvo = sessionStorage.getItem('pedidoAcompanhado');
  if(idSalvo){
    acompanharPedido(idSalvo);
  }
}

function atualizarPainelAcompanhamento(pedido){
  const painel = document.getElementById('acompanharPedido');
  const titulo = document.getElementById('acompanharTitulo');
  const detalhe = document.getElementById('acompanharDetalhe');

  painel.classList.add('mostrar');

  if(pedido.status === 'aceito'){
    painel.classList.add('aceito');
    titulo.textContent = '✅ Pedido nº ' + pedido.numero + ' aceito!';

    let texto = 'A loja confirmou seu pedido e já vai preparar.';
    if(pedido.tipo === 'Entrega'){
      const frete = Number(pedido.frete) || 0;
      const totalComFrete = Number(pedido.total || 0) + frete;
      texto += ' Frete: R$ ' + frete.toFixed(2).replace('.',',') +
        ' — Total com frete: R$ ' + totalComFrete.toFixed(2).replace('.',',');
    }
    detalhe.textContent = texto;
  } else {
    painel.classList.remove('aceito');
    titulo.textContent = '🕒 Pedido nº ' + pedido.numero + ' enviado';
    detalhe.textContent = 'Aguardando confirmação da loja...';
  }
}

function fecharAcompanhamento(){
  document.getElementById('acompanharPedido').classList.remove('mostrar');
  sessionStorage.removeItem('pedidoAcompanhado');
  if(pedidoAtualUnsub){
    pedidoAtualUnsub();
    pedidoAtualUnsub = null;
  }
  pedidoAtualId = null;
}

function enviarWhatsApp(){
  if(carrinho.length === 0) return;

  if(lojaFechada){
    alert('Atenção, a loja já está fechada.');
    return;
  }

  const nome = document.getElementById('cliente-nome').value.trim();
  const tipoPedido = document.getElementById('cliente-tipo-pedido').value;
  const endereco = document.getElementById('cliente-endereco').value.trim();
  const pagamento = document.getElementById('cliente-pagamento').value;

  if(!nome){
    alert('Por favor, preencha seu nome.');
    return;
  }
  if(!tipoPedido){
    alert('Por favor, escolha entre entrega ou retirada no local.');
    return;
  }
  if(tipoPedido === 'Entrega' && !endereco){
    alert('Por favor, preencha o endereço de entrega.');
    return;
  }

  if(tipoPedido === 'Entrega'){
    if(calculandoFrete){
      alert('Aguarde, ainda estamos calculando o frete...');
      return;
    }
    // A validação de que o endereço está em Ourinhos - SP já foi feita
    // pelo RESULTADO da API em calcularFreteEntrega(). Se freteCalculado
    // continua nulo aqui, é porque o endereço não foi confirmado.
    if(freteCalculado === null){
      alert('Não foi possível confirmar esse endereço em Ourinhos - SP. Verifique e tente novamente.');
      return;
    }
  }

  if(!pagamento){
    alert('Por favor, escolha a forma de pagamento.');
    return;
  }

  let trocoInfo = '';
  if(pagamento === 'Dinheiro'){
    const troco = document.getElementById('cliente-troco').value;
    if(!troco){
      alert('Por favor, informe se precisa de troco.');
      return;
    }
    if(troco === 'Preciso de troco'){
      const trocoValor = document.getElementById('cliente-troco-valor').value.trim();
      if(!trocoValor){
        alert('Por favor, informe para quanto precisa de troco.');
        return;
      }
      trocoInfo = 'TROCO PARA: ' + trocoValor;
    } else {
      trocoInfo = 'TROCO: Não precisa';
    }
  }

  const total = carrinho.reduce(function(s, i){ return s + (i.preco * i.quantidade); }, 0);
  const freteFinal = (tipoPedido === 'Entrega') ? freteCalculado : 0;
  const totalComFrete = total + freteFinal;
  const obs = document.getElementById('observacao-pedido').value.trim();
  const enderecoCompleto = endereco ? (endereco + ' — Ourinhos - SP') : '';

  const btnEnviar = document.getElementById('btn-enviar-whatsapp');
  btnEnviar.disabled = true;
  btnEnviar.textContent = 'Enviando...';

  proximoNumeroPedido().then(function(numero){
    const numeroFormatado = String(numero).padStart(4, '0');

    let texto = '━━━━━━━━━━━━━━\n';
    texto += '*MONSTRO BURGUER* — Nº ' + numeroFormatado + '\n';
    texto += '━━━━━━━━━━━━━━\n\n';

    texto += 'CLIENTE: ' + nome + '\n';
    texto += 'TIPO DE PEDIDO: ' + (tipoPedido === 'Entrega' ? 'Entrega' : 'Retirada no local') + '\n';
    if(tipoPedido === 'Entrega'){
      texto += 'ENDEREÇO: ' + enderecoCompleto + '\n';
      texto += 'FRETE: R$ ' + freteFinal.toFixed(2).replace('.',',') + '\n';
    }
    texto += 'FORMA DE PAGAMENTO: ' + pagamento + '\n';
    if(trocoInfo){
      texto += trocoInfo + '\n';
    }
    texto += '\n';

    texto += 'ITENS DO PEDIDO:\n';
    carrinho.forEach(function(i){
      const subtotal = (i.preco * i.quantidade).toFixed(2).replace('.',',');
      texto += i.quantidade + 'x ' + i.nome + ' - R$ ' + subtotal + '\n';
    });

    if(obs){
      texto += '\nOBSERVAÇÕES:\n' + obs + '\n';
    }

    texto += '\nTOTAL PRODUTOS: R$ ' + total.toFixed(2).replace('.',',') + '\n';
    if(tipoPedido === 'Entrega'){
      texto += 'TOTAL COM FRETE: R$ ' + totalComFrete.toFixed(2).replace('.',',') + '\n\n';
    } else {
      texto += '\n';
    }
    texto += 'Pode me chamar pra confirmar! Obrigado!';

    salvarPedidoFirestore(numeroFormatado, {
      cliente: nome,
      tipo: tipoPedido,
      endereco: tipoPedido === 'Entrega' ? enderecoCompleto : '',
      frete: freteFinal,
      pagamento: pagamento,
      trocoInfo: trocoInfo,
      itens: carrinho.map(function(i){
        return { nome: i.nome, quantidade: i.quantidade, preco: i.preco };
      }),
      observacao: obs,
      total: total
    }).then(function(){
      acompanharPedido(numeroFormatado);
    }).catch(function(){
      /* Se salvar o pedido falhar, o pedido ainda é enviado por WhatsApp normalmente */
    });

    const url = 'https://wa.me/' + whatsappPedidos + '?text=' + encodeURIComponent(texto);
    window.open(url, '_blank');

    btnEnviar.disabled = false;
    btnEnviar.textContent = '📱 Enviar Pedido';
    fecharModal();
  }).catch(function(erro){
    alert('Não foi possível gerar o número do pedido agora. Tente novamente.');
    btnEnviar.disabled = false;
    btnEnviar.textContent = '📱 Enviar Pedido';
  });
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) fecharModal();
});
</script>
