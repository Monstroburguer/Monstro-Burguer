<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 MONSTRO BURGUER — Início</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{
  --roxo: #BF00FF;
  --verde: #00FF41;
  --azul: #00CCFF;
  --fundo: #000000;
  --texto: #ffffff;
  --whatsapp: #25D366;
}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding-bottom:40px}

/* ===== CABEÇALHO ===== */
header{
  text-align:center;
  padding:15px 15px 10px;
  position:relative;
}

/* ⚙️ BOTÃO ADMIN — FIXO NO CANTO */
.botao-adm{
  position:fixed !important;
  top:10px !important;
  right:15px !important;
  z-index:9999 !important;
  width:40px;
  height:40px;
  background:transparent;
  border:2px solid var(--roxo);
  border-radius:50%;
  color:var(--roxo);
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 10px var(--roxo);
  transition:all .3s;
}
.botao-adm:hover{
  background:var(--roxo);
  color:#000;
  box-shadow:0 0 20px var(--roxo);
  transform:rotate(45deg);
}

/* 🖼️ LOGO / MASCOTE */
.logo-principal{
  width:280px;
  max-width:85%;
  height:auto;
  margin:5px auto;
  display:none; /* Oculto até carregar */
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
}
.slogan{color:#888;font-size:14px;margin:5px 0 20px}

/* ===== CATEGORIAS ===== */
.categorias{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 15px 25px;
  max-width:420px;
  margin:0 auto;
}
.cat-btn{
  padding:14px 10px;
  background:linear-gradient(90deg,rgba(0,204,255,.15),rgba(191,0,255,.15));
  border:2px solid var(--azul);
  border-radius:50px;
  color:var(--texto);
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:all .3s;
  text-align:center;
  animation:pulsarSuave 2.5s infinite alternate;
  text-shadow:0 0 5px var(--azul);
}
.cat-btn.ativo{
  background:linear-gradient(90deg,rgba(0,204,255,.3),rgba(191,0,255,.4));
  border-color:var(--roxo);
  box-shadow:0 0 15px var(--roxo), inset 0 0 8px var(--roxo);
  animation:none;
  transform:scale(1.03);
  text-shadow:0 0 8px var(--roxo);
}
.cat-btn:hover{border-color:var(--roxo);box-shadow:0 0 12px var(--roxo)}

@keyframes pulsarSuave {
  from {box-shadow:0 0 6px rgba(0,204,255,.3);border-color:rgba(0,204,255,.6);}
  to   {box-shadow:0 0 12px rgba(191,0,255,.4);border-color:rgba(191,0,255,.8);}
}

.btn-1col{grid-column:1 / -1;max-width:240px;margin:0 auto}

/* ===== ÁREA DE AÇÃO ===== */
.area-botoes{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:10px 15px 30px;
  max-width:420px;
  margin:0 auto;
}

/* 💚 WHATSAPP */
.btn-whatsapp{
  width:50px;
  height:50px;
  background:radial-gradient(circle, rgba(37,211,102,.3), rgba(37,211,102,.1));
  border:2px solid var(--whatsapp);
  border-radius:50%;
  color:var(--whatsapp);
  font-size:24px;
  cursor:pointer;
  box-shadow:0 0 12px var(--whatsapp), inset 0 0 5px rgba(37,211,102,.2);
  transition:all .3s;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  flex-shrink:0;
  animation:brilhoWhatsapp 2s infinite alternate;
}
@keyframes brilhoWhatsapp {
  from {box-shadow:0 0 8px var(--whatsapp), inset 0 0 3px rgba(37,211,102,.15);}
  to   {box-shadow:0 0 18px var(--whatsapp), inset 0 0 8px rgba(37,211,102,.3);}
}
.btn-whatsapp:hover{transform:scale(1.15);background:rgba(37,211,102,.25)}

/* 📋 VER CARDÁPIO */
.btn-cardapio{
  flex:none;
  width:270px;
  max-width:75%;
  padding:13px 20px;
  background:linear-gradient(90deg,var(--azul),var(--roxo));
  border:none;
  border-radius:50px;
  color:#fff;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 12px var(--azul), 0 0 20px var(--roxo);
  transition:all .3s;
  animation:brilhoCardapio 2s infinite alternate;
  text-decoration:none;
  text-align:center;
  white-space:nowrap;
}
@keyframes brilhoCardapio {
  from {box-shadow:0 0 12px var(--azul), 0 0 20px var(--roxo);}
  to   {box-shadow:0 0 20px var(--azul), 0 0 30px var(--roxo);}
}
.btn-cardapio:hover{transform:scale(1.03)}

/* ===== BANNERS ===== */
.banner-principal,.banner-promo{
  width:100%;
  max-height:150px;
  object-fit:cover;
  display:none;
  border-bottom:2px solid var(--azul);
  box-shadow:0 0 15px rgba(0,204,255,.3);
  background:transparent !important;
  margin-bottom:10px;
}
.banner-principal.visivel{display:block}
.banner-promo{
  max-height:100px;
  border-bottom:2px solid var(--roxo);
  box-shadow:0 0 12px rgba(191,0,255,.2);
}
.banner-promo.visivel{display:block}

/* ===== STATUS LOJA ===== */
.status-loja{
  position:fixed;
  top:10px;
  left:15px;
  z-index:9998;
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.7);
  padding:6px 12px;
  border-radius:30px;
  border:1px solid #444;
}
.status-bolinha{
  width:10px;
  height:10px;
  border-radius:50%;
  animation:pulsarStatus 2s infinite alternate;
}
.status-texto{
  font-size:13px;
  font-weight:bold;
}
.loja-aberta .status-bolinha{background:var(--verde);box-shadow:0 0 8px var(--verde)}
.loja-fechada .status-bolinha{background:var(--vermelho);box-shadow:0 0 8px var(--vermelho)}
@keyframes pulsarStatus{from{opacity:.7}to{opacity:1}}
</style>
</head>
<body>

<!-- 🟢 STATUS LOJA -->
<div id="status-loja" class="status-loja loja-fechada">
  <div class="status-bolinha"></div>
  <span class="status-texto">FECHADO</span>
</div>

<img id="banner-principal-img" class="banner-principal" alt="Banner Principal">
<img id="banner-promo-img" class="banner-promo" alt="Banner Promoção">

<!-- ⚙️ BOTÃO ADMIN -->
<button class="botao-adm" onclick="window.location.href='admin.html'" title="Acessar Administrador">⚙️</button>

<header>
    <img id="logo-principal" class="logo-principal" alt="MONSTRO BURGUER">
    <p class="slogan">O sabor monstruoso que você merece!</p>
</header>

<!-- CATEGORIAS -->
<div class="categorias">
    <button class="cat-btn ativo" onclick="irParaCardapio('todos')">🍔 Todos</button>
    <button class="cat-btn" onclick="irParaCardapio('lanches')">🍔 Lanches</button>
    <button class="cat-btn" onclick="irParaCardapio('bebidas')">🥤 Bebidas</button>
    <button class="cat-btn" onclick="irParaCardapio('adicionais')">➕ Adicionais</button>
    <button class="cat-btn btn-1col" onclick="irParaCardapio('combos')">📦 Combos</button>
</div>

<!-- 💬 WHATSAPP + VER CARDÁPIO -->
<div class="area-botoes">
    <a href="https://wa.me/5514996619487" target="_blank" class="btn-whatsapp" title="Falar no WhatsApp">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.36-.18-2.17-1.07-2.51-1.19-.34-.12-.59-.18-.84.18-.25.36-.97 1.19-1.19 1.44-.22.25-.44.28-.81.1-.37-.18-1.56-.57-2.97-1.81-1.1-.98-1.84-2.19-2.06-2.56-.18-.34-.19-.54-.01-.71.18-.18.4-.47.6-.71.2-.24.27-.42.4-.7.13-.28.06-.52-.03-.71-.09-.19-.81-1.95-1.11-2.67-.29-.72-.59-.62-.84-.63-.22 0-.47-.01-.72-.01-.25 0-.65.07-.99.49-.34.42-1.29 1.26-1.29 3.04 0 1.78 1.33 3.51 1.51 3.77.18.26 2.59 3.95 6.23 5.53.87.37 1.55.6 2.07.77.87.26 1.67.22 2.29.14.7-.09 2.17-.88 2.48-1.73.31-.85.31-1.57.22-1.73-.09-.16-.33-.26-.69-.42z"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0C5.373 0 0 5.373 0 12c0 2.126.553 4.13 1.512 5.888L.266 23.654a.5.5 0 00.635.582l5.886-2.173A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.937 9.937 0 01-5.169-1.424l-.373-.224-3.487 1.285 1.327-3.403-.243-.387A9.933 9.933 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
        </svg>
    </a>
    <a href="cardapio.html" class="btn-cardapio">VER CARDÁPIO</a>
</div>

<script>
window.onload = function(){
    carregarConfiguracoesDaLoja();
    atualizarStatusLoja();
};

// ✅ FUNÇÃO CORRIGIDA — BUSCA DIRETO DO QUE O ADMIN SALVA!
function carregarConfiguracoesDaLoja(){
    // Busca direto do localStorage onde o Admin salva!
    const mascote = localStorage.getItem("mascotePersonalizado");
    const logo = localStorage.getItem("logoPersonalizada");
    const banner = localStorage.getItem("bannerPersonalizado");
    const bannerPromo = localStorage.getItem("bannerPromoPersonalizado");

    // ✅ MASCOTE FIXO — APARECE PRA TODO MUNDO!
const img = document.getElementById('logo-principal');
img.src = "https://raw.githubusercontent.com/Monstroburguer/Monstro-Burguer/main/mascote.jpg";
img.style.display = 'block';

    // Exibe o Banner Principal
    if(banner){
        const b = document.getElementById('banner-principal-img');
        b.src = banner;
        b.classList.add('visivel');
    }
    // Exibe o Banner de Promoção
    if(bannerPromo){
        const bp = document.getElementById('banner-promo-img');
        bp.src = bannerPromo;
        bp.classList.add('visivel');
    }
}

// ✅ STATUS DA LOJA — ABERTO/FECHADO
function atualizarStatusLoja(){
    const lojaAberta = localStorage.getItem("lojaAberta") !== "false";
    const el = document.getElementById('status-loja');
    const texto = el.querySelector('.status-texto');
    
    if(lojaAberta){
        el.classList.remove('loja-fechada');
        el.classList.add('loja-aberta');
        texto.textContent = "ABERTO";
    }else{
        el.classList.remove('loja-aberta');
        el.classList.add('loja-fechada');
        texto.textContent = "FECHADO";
    }
}

function irParaCardapio(categoria){
    localStorage.setItem('categoriaInicial', categoria);
    window.location.href = 'cardapio.html';
}
</script>

</body>
</html>
