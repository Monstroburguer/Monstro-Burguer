<!DOCTYPE html>
<html lang="pt‑BR">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>🍔 MONSTRO BURGUER — Início</title>
  <style>
    * { margin:0; padding:0; box‑sizing:border‑box; font‑family:Arial, 'Segoe UI', Roboto, sans‑serif; }
    html, body {
      background: #000000;
      color: #ffffff;
      min‑height: 100vh;
      padding‑top: 62px;
      padding‑bottom: 30px;
    }
    :root {
      --roxo: #BF00FF;
      --verde: #00FF41;
      --azul: #00CCFF;
      --fundo‑btn: #120822;
    }

    /* 🟢 STATUS LOJA */
    .status‑box {
      position:fixed; top:12px; left:12px; z‑index:90;
      display:flex; gap:7px; align‑items:center;
      background:rgba(0,0,0,.85); border:1px solid #444;
      border‑radius:50px; padding:6px 14px;
      font‑size:14px; font‑weight:500;
    }
    .ponto {width:11px; height:11px; border‑radius:50%; background:#555;}
    .aberto .ponto {
      background:var(--verde); box‑shadow:0 0 9px var(--verde);
      animation: brilhoPonto 2s infinite alternate;
    }
    @keyframes brilhoPonto {0%{opacity:.65}100%{opacity:1}}

    /* ⚙️ ENGRENAGEM / ADMIN */
    .botao‑engrenagem {
      position:fixed; top:12px; right:12px; z‑index:99;
      width:42px; height:42px; border‑radius:50%;
      border:2px solid var(--roxo); background:rgba(0,0,0,.85);
      color:var(--roxo); font‑size:20px; line‑height:38px; text‑align:center;
      text‑decoration:none; cursor:pointer;
      box‑shadow:0 0 10px rgba(191,0,255,.35), inset 0 0 6px rgba(191,0,255,.12);
      transition:all .25s ease;
    }
    .botao‑engrenagem:hover {background:var(--roxo); color:#000; transform:scale(1.05);}

    /* 🖼️ LOGO / MARCA */
    .bloco‑logo {
      text‑align:center; padding:5px 16px 24px;
    }
    .logo‑marca {
      width:100%; max‑width:380px; margin:0 auto; display:block;
      height:auto;
    }
    .frase‑marca {
      color:#aaa; font‑size:15px; margin‑top:6px;
    }

    /* 🎯 GRADE — EXATA: Todos | Lanches → Bebidas | Adicionais → Combos CENTRO */
    .grade‑botoes {
      max‑width:440px; margin:0 auto; padding:0 16px;
      display:grid;
      grid‑template‑columns: repeat(2, 1fr);
      gap:14px;
    }

    /* ✨ BOTÕES — MAIS CHEIOS, ARREDONDADOS, PREENCHIMENTO UNIFORME */
    .botao‑cat {
      border‑radius:50px;
      border:2px solid var(--azul);
      background: linear‑gradient(135deg, rgba(0,204,255,.22), rgba(191,0,255,.28));
      background‑color: var(--fundo‑btn);
      color:#fff; font‑size:17px; font‑weight:bold;
      padding:16px 12px; /* MAIS ALTO / CHEIO */
      text‑align:center; cursor:pointer;
      box‑shadow:
        0 0 8px rgba(0,204,255,.18),
        inset 0 1px 0 rgba(255,255,255,.06);
      transition:all .22s ease;
      text‑decoration:none;
    }
    .botao‑cat.ativo, .botao‑cat:hover {
      border‑color: var(--roxo);
      background: linear‑gradient(135deg, rgba(0,204,255,.35), rgba(191,0,255,.40));
      box‑shadow:
        0 0 14px rgba(191,0,255,.40),
        inset 0 1px 0 rgba(255,255,255,.10);
      transform:scale(1.03);
    }
    .botao‑cat:active {transform:scale(.97);}

    .botao‑linha‑cheia {
      grid‑column: span 2;
      max‑width:260px; margin:0 auto;
    }

    /* 📞 FALE CONOSCO — IGUAL ESTILO, FORTE E COMPLETO */
    .botao‑fale {
      max‑width:440px; margin:24px auto 14px; padding:0 16px;
      border‑radius:50px; border:2px solid var(--roxo);
      background: linear‑gradient(135deg, rgba(0,204,255,.22), rgba(191,0,255,.28));
      background‑color: var(--fundo‑btn);
      color:#fff; font‑size:17px; font‑weight:bold;
      padding:16px 12px;
      text‑align:center; cursor:pointer;
      display:block; text‑decoration:none;
      box‑shadow:
        0 0 12px rgba(191,0,255,.28),
        inset 0 1px 0 rgba(255,255,255,.06);
      transition:all .22s ease;
    }
    .botao‑fale:hover {
      transform:scale(1.02);
      box‑shadow:
        0 0 18px rgba(191,0,255,.42),
        inset 0 1px 0 rgba(255,255,255,.10);
    }
    .botao‑fale:active {transform:scale(.97);}

    /* 📋 VER CARDÁPIO — PRINCIPAL, MAIS BRILHO */
    .botao‑ver {
      max‑width:440px; margin:0 auto; padding:0 16px;
      border‑radius:50px; border:none;
      background: linear‑gradient(90deg, var(--azul), var(--roxo));
      color:#fff; font‑size:17px; font‑weight:bold;
      padding:16px 12px;
      text‑align:center;
      display:block; text‑decoration:none;
      box‑shadow:
        0 0 14px rgba(0,204,255,.32),
        0 0 22px rgba(191,0,255,.18),
        inset 0 1px 0 rgba(255,255,255,.12);
      transition:transform .22s ease;
    }
    .botao‑ver:hover {opacity:.95; transform:scale(1.02);}
    .botao‑ver:active {transform:scale(.97);}
  </style>
</head>
<body>

<div class="status‑box aberto">
  <div class="ponto"></div>
  <span id="texto‑status">LOJA ABERTA</span>
</div>

<a class="botao‑engrenagem" href="admin.html">⚙</a>

<div class="bloco‑logo">
  <img class="logo‑marca" alt="MONSTRO BURGUER"
    src="https://i.imgur.com/9WLN0Dv.png">
  <p class="frase‑marca">O sabor monstruoso que você merece!</p>
</div>

<div class="grade‑botoes">
  <button class="botao‑cat ativo" onclick="irPara('todos')">🍔 Todos</button>
  <button class="botao‑cat" onclick="irPara('lanches')">🍔 Lanches</button>
  <button class="botao‑cat" onclick="irPara('bebidas')">🥤 Bebidas</button>
  <button class="botao‑cat" onclick="irPara('adicionais')">➕ Adicionais</button>
  <button class="botao‑cat botao‑linha‑cheia" onclick="irPara('combos')">📦 Combos</button>
</div>

<a class="botao‑fale" href="https://wa.me/5514996619487" target="_blank">📞 FALE CONOSCO</a>
<a class="botao‑ver" href="cardapio.html">📋 VER CARDÁPIO — FAZER PEDIDO</a>

<script>
function irPara(categoria){
  localStorage.setItem('categoriaInicial', categoria);
  window.location.href = 'cardapio.html';
}
window.onload = function(){
  const caixa=document.querySelector('.status‑box'), txt=document.getElementById('texto‑status'),
        ok=localStorage.getItem('lojaAberta')!=='false';
  caixa.classList.toggle('aberto',ok);
  txt.textContent=ok?'LOJA ABERTA':'LOJA FECHADA';
};
</script>
</body>
</html>
