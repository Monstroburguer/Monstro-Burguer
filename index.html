<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONSTRO BURGUER</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Segoe UI", sans-serif;
    }

    :root {
      --azul: #00ccff;
      --roxo: #bf00ff;
      --verde: #00ff41;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 25%,
          rgba(0, 204, 255, .13),
          transparent 28%),
        radial-gradient(circle at 50% 48%,
          rgba(191, 0, 255, .08),
          transparent 38%),
        #050505;
      color: white;
      padding: 14px;
      overflow-x: hidden;
    }

    /* TOPO */

    .topo {
      max-width: 430px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-box {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 30px;
      background: rgba(10,10,10,.85);
      border: 1px solid #292929;
      font-size: 11px;
      font-weight: bold;
    }

    .ponto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }

    .aberto .ponto {
      background: var(--verde);
      box-shadow: 0 0 8px var(--verde);
      animation: piscar 1.8s infinite alternate;
    }

    @keyframes piscar {
      from { opacity: .5; }
      to { opacity: 1; }
    }

    .botao-engrenagem {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #111;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 17px;
    }

    /* MASCOTE */

    .area-mascote {
      max-width: 430px;
      margin: 5px auto 8px;
      text-align: center;
      position: relative;
      padding: 4px 0 0;

      /* SEM QUADRO / SEM MOLDURA */
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .area-mascote::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 210px;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse,
        rgba(0,204,255,.13),
        rgba(191,0,255,.06),
        transparent 72%
      );
      filter: blur(18px);
      z-index: -1;
    }

    .mascote {
      width: 78%;
      max-width: 310px;
      max-height: 270px;
      object-fit: contain;
      display: block;
      margin: auto;

      /* BRILHO DA PRÓPRIA LOGO/MASCOTE */
      filter:
        drop-shadow(0 0 7px rgba(0,204,255,.22))
        drop-shadow(0 0 18px rgba(191,0,255,.10));

      animation: respirar 4s ease-in-out infinite;
    }

    @keyframes respirar {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.015);
      }
    }

    .frase {
      margin-top: -2px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    /* TÍTULO */

    .titulo {
      max-width: 430px;
      margin: 20px auto 11px;
      text-align: center;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 5px rgba(0,204,255,.45),
        0 0 12px rgba(191,0,255,.18);
    }

    /* CATEGORIAS */

    .grade-botoes {
      max-width: 430px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .botao-cat {
      min-height: 68px;
      border-radius: 23px;
      border: 1px solid rgba(0,204,255,.22);

      background:
        linear-gradient(
          145deg,
          rgba(0,204,255,.07),
          rgba(191,0,255,.06)
        ),
        #101010;

      color: #eee;
      cursor: pointer;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;

      font-size: 13px;
      font-weight: bold;

      transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease,
        background .15s ease;
    }

    .botao-cat .icone {
      font-size: 21px;
      line-height: 1;
    }

    .botao-cat:active,
    .botao-cat.ativo {
      transform: scale(.96);
      border-color: var(--azul);

      background:
        linear-gradient(
          145deg,
          rgba(0,204,255,.20),
          rgba(191,0,255,.13)
        ),
        #101010;

      box-shadow:
        0 0 7px rgba(0,204,255,.42),
        0 0 17px rgba(0,204,255,.16),
        inset 0 0 10px rgba(0,204,255,.08);
    }

    .botao-linha-cheia {
      grid-column: span 2;
      min-height: 54px;
      flex-direction: row;
      gap: 7px;
    }

    /* AÇÕES */

    .acoes {
      max-width: 430px;
      margin: 18px auto 0;
      display: flex;
      gap: 9px;
      align-items: center;
    }

    /*
      BOTÃO VER CARDÁPIO

      Estado normal:
      roxo suave + moldura verde neon discreta.

      A moldura verde permanece fixa.
      Somente o roxo reage ao clique.
    */

    .botao-ver {
      flex: 1;
      min-height: 51px;
      border-radius: 24px;

      border: 1px solid rgba(0,255,65,.75);

      background:
        linear-gradient(
          100deg,
          rgba(120,0,180,.78),
          rgba(160,0,220,.72)
        );

      color: white;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .4px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      box-shadow:
        0 0 6px rgba(0,255,65,.16),
        0 0 12px rgba(191,0,255,.10);

      transition:
        transform .12s ease,
        background .08s ease,
        box-shadow .08s ease;
    }

    /*
      FAROL ALTO

      Ao tocar:
      o verde continua discreto.
      O roxo recebe o clarão forte.
    */

    .botao-ver:active {
      transform: scale(.96);

      background:
        linear-gradient(
          100deg,
          #d100ff,
          #ff35ff
        );

      box-shadow:
        0 0 12px rgba(191,0,255,.85),
        0 0 28px rgba(191,0,255,.70),
        0 0 50px rgba(191,0,255,.38);

      transition: none;
    }

    /* WHATSAPP */

    .botao-whatsapp {
      width: 51px;
      height: 51px;
      flex: 0 0 51px;

      border-radius: 50%;
      border: 1px solid rgba(0,255,65,.45);

      background: rgba(0,255,65,.07);
      color: var(--verde);

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      font-size: 24px;

      box-shadow:
        0 0 8px rgba(0,255,65,.12);

      transition: .15s;
    }

    .botao-whatsapp:active {
      transform: scale(.90);

      background: rgba(0,255,65,.18);

      box-shadow:
        0 0 10px rgba(0,255,65,.65),
        0 0 22px rgba(0,255,65,.28);
    }

    @media (max-width: 360px) {

      body {
        padding: 11px;
      }

      .mascote {
        width: 72%;
        max-height: 230px;
      }

      .titulo {
        font-size: 14px;
      }

      .botao-cat {
        min-height: 63px;
      }
    }
  </style>
</head>

<body>

  <!-- TOPO -->

  <div class="topo">

    <div class="status-box aberto">
      <div class="ponto"></div>
      <span id="texto-status">LOJA ABERTA</span>
    </div>

    <a class="botao-engrenagem" href="admin.html">⚙</a>

  </div>


  <!-- MASCOTE -->

  <div class="area-mascote">

    <img
      id="mascote"
      class="mascote"
      alt="Monstro Burguer"
      src="https://i.imgur.com/9WLN0Dv.png"
    >

    <div class="frase">
      A FOME CHAMOU.
    </div>

  </div>


  <!-- CATEGORIAS -->

  <div class="titulo">
    ESCOLHA O TAMANHO DA SUA FOME
  </div>

  <div class="grade-botoes">

    <button class="botao-cat ativo" onclick="irPara('todos')">
      <span class="icone">🍔</span>
      <span>Todos</span>
    </button>

    <button class="botao-cat" onclick="irPara('lanches')">
      <span class="icone">🍔</span>
      <span>Lanches</span>
    </button>

    <button class="botao-cat" onclick="irPara('bebidas')">
      <span class="icone">🥤</span>
      <span>Bebidas</span>
    </button>

    <button class="botao-cat" onclick="irPara('adicionais')">
      <span class="icone">➕</span>
      <span>Adicionais</span>
    </button>

    <button
      class="botao-cat botao-linha-cheia"
      onclick="irPara('combos')"
    >
      <span class="icone">📦</span>
      <span>Combos</span>
    </button>

  </div>


  <!-- BOTÃO PRINCIPAL + WHATSAPP -->

  <div class="acoes">

    <a class="botao-ver" href="cardapio.html">
      VER CARDÁPIO
    </a>

    <a
      class="botao-whatsapp"
      href="https://wa.me/5514996619487"
      target="_blank"
      aria-label="WhatsApp"
    >
      ☎
    </a>

  </div>


  <script>

    function irPara(categoria) {
      localStorage.setItem("categoriaInicial", categoria);
      window.location.href = "cardapio.html";
    }


    window.onload = function() {

      /* STATUS DA LOJA */

      const caixa = document.querySelector(".status-box");
      const texto = document.getElementById("texto-status");

      const lojaAberta =
        localStorage.getItem("lojaAberta") !== "false";

      caixa.classList.toggle("aberto", lojaAberta);

      texto.textContent =
        lojaAberta
          ? "LOJA ABERTA"
          : "LOJA FECHADA";


      /* MASCOTE SALVO NO ADM */

      const mascote = document.getElementById("mascote");

      const mascoteSalvo =
        localStorage.getItem("monstroMascote");

      if (mascoteSalvo) {
        mascote.src = mascoteSalvo;
      }

    };

  </script>

</body>
</html>
