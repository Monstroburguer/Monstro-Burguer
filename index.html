<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONSTRO BURGUER</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --azul: #00ccff;
      --roxo: #bf00ff;
      --verde: #00ff41;
      --cinza: #151515;
      --cinza2: #202020;
    }

    body {
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 204, 255, .08), transparent 35%),
        #050505;
      color: white;
      min-height: 100vh;
      padding: 16px;
    }

    /* TOPO */

    .topo {
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-box {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: bold;
    }

    .ponto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }

    .aberto .ponto {
      background: var(--verde);
      box-shadow: 0 0 8px var(--verde);
      animation: piscar 1.8s infinite alternate;
    }

    @keyframes piscar {
      from { opacity: .5; }
      to { opacity: 1; }
    }

    .botao-engrenagem {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #333;
      background: #111;
      color: #aaa;
      text-decoration: none;
      font-size: 17px;
      transition: .2s;
    }

    .botao-engrenagem:hover {
      color: var(--azul);
      border-color: var(--azul);
      box-shadow: 0 0 10px rgba(0,204,255,.3);
    }

    /* LOGO */

    .bloco-logo {
      max-width: 430px;
      margin: 15px auto 22px;
      text-align: center;
    }

    .logo-marca {
      width: 78%;
      max-width: 310px;
      display: block;
      margin: auto;
    }

    .frase-marca {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    /* CATEGORIAS */

    .titulo {
      max-width: 430px;
      margin: 0 auto 10px;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-botoes {
      max-width: 430px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .botao-cat {
      min-height: 72px;
      border: 1px solid #292929;
      border-radius: 15px;
      background: linear-gradient(145deg, #151515, #0d0d0d);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 13px;
      font-weight: bold;
      transition: .2s;
    }

    .botao-cat .icone {
      font-size: 22px;
      line-height: 1;
    }

    .botao-cat.ativo {
      border-color: var(--azul);
      background:
        linear-gradient(145deg,
        rgba(0,204,255,.16),
        rgba(191,0,255,.10));
      box-shadow: 0 0 14px rgba(0,204,255,.12);
    }

    .botao-cat:active {
      transform: scale(.96);
    }

    .botao-linha-cheia {
      grid-column: span 2;
      min-height: 58px;
      flex-direction: row;
      gap: 8px;
    }

    /* BOTÃO PRINCIPAL */

    .botao-ver {
      max-width: 430px;
      margin: 22px auto 9px;
      min-height: 54px;
      border-radius: 14px;
      background: linear-gradient(100deg, var(--azul), var(--roxo));
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 5px 20px rgba(0,204,255,.15);
      transition: .2s;
    }

    .botao-ver:active {
      transform: scale(.97);
    }

    /* WHATSAPP */

    .botao-fale {
      max-width: 430px;
      margin: 0 auto;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #292929;
      background: #101010;
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: .2s;
    }

    .botao-fale:active {
      transform: scale(.97);
    }

    /* CELULARES PEQUENOS */

    @media (max-width: 360px) {

      body {
        padding: 12px;
      }

      .logo-marca {
        width: 72%;
      }

      .botao-cat {
        min-height: 65px;
      }

      .botao-cat .icone {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- TOPO -->
  <div class="topo">

    <div class="status-box aberto">
      <div class="ponto"></div>
      <span id="texto-status">LOJA ABERTA</span>
    </div>

    <a class="botao-engrenagem" href="admin.html">⚙</a>

  </div>


  <!-- LOGO -->
  <div class="bloco-logo">

    <img
      class="logo-marca"
      alt="MONSTRO BURGUER"
      src="https://i.imgur.com/9WLN0Dv.png"
    >

    <p class="frase-marca">
      O sabor monstruoso que você merece!
    </p>

  </div>


  <!-- CATEGORIAS -->
  <div class="titulo">
    Escolha uma categoria
  </div>

  <div class="grade-botoes">

    <button class="botao-cat ativo" onclick="irPara('todos')">
      <span class="icone">🍔</span>
      <span>Todos</span>
    </button>

    <button class="botao-cat" onclick="irPara('lanches')">
      <span class="icone">🍔</span>
      <span>Lanches</span>
    </button>

    <button class="botao-cat" onclick="irPara('bebidas')">
      <span class="icone">🥤</span>
      <span>Bebidas</span>
    </button>

    <button class="botao-cat" onclick="irPara('adicionais')">
      <span class="icone">➕</span>
      <span>Adicionais</span>
    </button>

    <button class="botao-cat botao-linha-cheia" onclick="irPara('combos')">
      <span class="icone">📦</span>
      <span>Combos</span>
    </button>

  </div>


  <!-- AÇÕES -->

  <a
    class="botao-ver"
    href="cardapio.html"
  >
    📋 &nbsp; VER CARDÁPIO
  </a>

  <a
    class="botao-fale"
    href="https://wa.me/5514996619487"
    target="_blank"
  >
    📞 &nbsp; Fale conosco
  </a>


  <script>

    function irPara(categoria) {
      localStorage.setItem("categoriaInicial", categoria);
      window.location.href = "cardapio.html";
    }

    window.onload = function() {

      const caixa = document.querySelector(".status-box");
      const texto = document.getElementById("texto-status");

      const lojaAberta =
        localStorage.getItem("lojaAberta") !== "false";

      caixa.classList.toggle("aberto", lojaAberta);

      texto.textContent =
        lojaAberta
          ? "LOJA ABERTA"
          : "LOJA FECHADA";
    };

  </script>

</body>
</html>
