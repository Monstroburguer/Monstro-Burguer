<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>MONSTRO BURGUER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --void: #05070d;
      --ciano: #00e5ff;
      --ciano-dim: rgba(0, 229, 255, 0.35);
      --violeta: #8b2fff;
      --violeta-dim: rgba(139, 47, 255, 0.35);
      --verde: #39ff88;
      --vermelho: #ff3b5c;
      --texto: #eaf6ff;
      --mono: 'JetBrains Mono', monospace;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      height: 100dvh;
      max-width: 430px;

      padding: 12px 0 12px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.07), transparent 42%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 38px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 38px),
        var(--void);

      border-style: solid;
      border-color: var(--ciano);
      border-width: 2px 7px;
      border-radius: 24px;

      box-shadow:
        0 0 16px rgba(0, 240, 255, 0.55),
        0 0 34px rgba(139, 47, 255, 0.20),
        inset 0 0 16px rgba(0, 240, 255, 0.10);
    }

    .status {
      position: absolute;
      top: 14px;
      left: 15px;

      height: 30px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 6px;

      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65);

      border: 1px solid var(--verde);

      color: var(--verde);

      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;

      z-index: 20;

      box-shadow: 0 0 8px rgba(57, 255, 136, 0.35);
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--verde);
      box-shadow: 0 0 6px var(--verde);
      flex-shrink: 0;
    }

    .status::after {
      content: "_";
      animation: piscar 1s step-start infinite;
    }

    .status.fechado {
      border-color: var(--vermelho);
      color: var(--vermelho);
      box-shadow: 0 0 8px rgba(255, 59, 92, 0.35);
    }

    .status.fechado::before {
      background: var(--vermelho);
      box-shadow: 0 0 6px var(--vermelho);
    }

    @keyframes piscar {
      50% { opacity: 0; }
    }

    .config {
      position: absolute;

      top: 10px;
      right: 15px;

      width: 34px;
      height: 34px;

      display: flex;
      justify-content: center;
      align-items: center;

      clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);

      border: 1.5px solid var(--violeta);

      background: rgba(0, 0, 0, 0.75);

      color: var(--texto);

      text-decoration: none;

      font-size: 15px;

      z-index: 20;

      box-shadow: 0 0 9px var(--violeta-dim);
    }

    .mascote-area {
      width: 100%;
      height: 46%;
      flex: 0 0 46%;

      position: relative;
      overflow: hidden;
    }

    .mascote {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center 35%;

      -webkit-mask-image: radial-gradient(ellipse 78% 82% at 50% 42%, #fff 55%, transparent 100%);
      mask-image: radial-gradient(ellipse 78% 82% at 50% 42%, #fff 55%, transparent 100%);

      animation: respirar 4s ease-in-out infinite;
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: -40%;
      height: 45%;

      background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.18), transparent);

      animation: escanear 6s linear infinite;
      pointer-events: none;
    }

    @keyframes escanear {
      0% { top: -45%; }
      100% { top: 100%; }
    }

    .subtitulo {
      width: 100%;
      margin-top: 10px;

      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: rgba(0, 229, 255, 0.65);

      text-align: center;
    }

    .categorias {
      width: 100%;
      padding: 0 14px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 9px;

      margin-top: 10px;

      flex-shrink: 0;
    }

    .categoria {
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);

      border: 1px solid var(--ciano-dim);

      background: linear-gradient(135deg, rgba(139, 47, 255, 0.20), rgba(0, 229, 255, 0.06));
      background-size: 220% 220%;

      color: var(--texto);

      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;

      animation: viverBtn 4.5s ease-in-out infinite;

      transition: transform 0.12s ease;
    }

    @keyframes viverBtn {
      0%, 100% {
        box-shadow: 0 0 7px rgba(0, 229, 255, 0.22), inset 0 0 9px rgba(139, 47, 255, 0.08);
        background-position: 0% 50%;
      }
      50% {
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.50), inset 0 0 16px rgba(139, 47, 255, 0.28);
        background-position: 100% 50%;
      }
    }

    .categoria.clicado,
    .btn-cardapio.clicado {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.95), rgba(139, 47, 255, 0.75)) !important;
      color: #00150a !important;
      border-color: #ffffff !important;
      box-shadow:
        0 0 26px rgba(0, 229, 255, 1),
        0 0 46px rgba(139, 47, 255, 0.85) !important;
      transition: all 0.06s ease-out;
    }

    .btn-whatsapp.clicado {
      box-shadow: 0 0 26px rgba(37, 211, 102, 1) !important;
      transition: all 0.06s ease-out;
    }

    .categoria:active {
      transform: scale(0.95);

      background: linear-gradient(135deg, rgba(57, 255, 136, 0.75), rgba(0, 229, 255, 0.35));

      color: #00150a;

      border-color: #ffffff;

      box-shadow:
        0 0 16px rgba(0, 229, 255, 0.95),
        0 0 30px rgba(57, 255, 136, 0.65);
    }

    .categoria-combo {
      grid-column: span 2;
      width: 60%;
      justify-self: center;
    }

    .rodape-acoes {
      width: 100%;
      padding: 0 14px;

      margin-top: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-bottom: 4px;

      flex-shrink: 0;
    }

    .btn-whatsapp {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.55);
      border-radius: 50%;

      text-decoration: none;

      animation: pulsarZap 2.6s ease-in-out infinite;

      transition: transform 0.15s;
    }

    @keyframes pulsarZap {
      0%, 100% { box-shadow: 0 0 6px rgba(37, 211, 102, 0.35); }
      50% { box-shadow: 0 0 16px rgba(37, 211, 102, 0.75); }
    }

    .btn-whatsapp:active {
      transform: scale(0.90);
    }

    .btn-whatsapp svg {
      width: 26px;
      height: 26px;
      fill: #25D366;
    }

    .btn-cardapio {
      position: relative;
      overflow: hidden;

      width: 65%;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);

      border: 1.5px solid var(--ciano);

      background: linear-gradient(135deg, rgba(0, 229, 255, 0.22), rgba(139, 47, 255, 0.18));
      background-size: 220% 220%;

      color: var(--texto);

      text-decoration: none;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;

      animation: viverCta 3.5s ease-in-out infinite;

      transition: transform 0.12s ease;
    }

    @keyframes viverCta {
      0%, 100% {
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.40);
        background-position: 0% 50%;
      }
      50% {
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.80), 0 0 34px rgba(139, 47, 255, 0.35);
        background-position: 100% 50%;
      }
    }

    .btn-cardapio::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;

      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);

      animation: brilho 3.2s ease-in-out infinite;
    }

    @keyframes brilho {
      0% { left: -60%; }
      100% { left: 130%; }
    }

    .btn-cardapio:active {
      transform: scale(0.96);
    }

    @media (max-height: 680px) {
      .mascote-area {
        height: 44%;
        flex-basis: 44%;
      }

      .categoria {
        height: 40px;
      }

      .btn-cardapio {
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="status" id="status">
      <span id="statusTexto">ABERTO</span>
    </div>

    <a
      href="adm.html"
      class="config"
      aria-label="Administração"
    >
      ⚙️
    </a>

    <!-- MASCOTE -->
    <section class="mascote-area">

      <img
        id="mascote"
        src="mascote-oficial.png"
        alt="Mascote oficial Monstro Burguer"
        class="mascote"
      >

      <div class="scan-line"></div>

    </section>

    <div class="subtitulo">
      // O sabor monstruoso que você merece
    </div>

    <nav class="categorias">

      <a href="cardapio.html" class="categoria">
        🍔 Todos
      </a>

      <a href="cardapio.html" class="categoria">
        🍔 Lanches
      </a>

      <a href="cardapio.html" class="categoria">
        🥤 Bebidas
      </a>

      <a href="cardapio.html" class="categoria">
        ➕ Adicionais
      </a>

      <a
        href="cardapio.html"
        class="categoria categoria-combo"
      >
        📦 Combos
      </a>

    </nav>

    <div class="rodape-acoes">

      <a
        href="https://wa.me/5514996619487"
        class="btn-whatsapp"
        target="_blank"
        aria-label="WhatsApp"
      >

        <svg viewBox="0 0 32 32">

          <path d="M19.11 17.42c-.27-.14-1.58-.78-1.83-.87-.25-.09-.43-.14-.61.14-.18.27-.7.87-.86 1.05-.16.18-.32.2-.59.07-.27-.14-1.12-.41-2.14-1.32-.79-.7-1.32-1.56-1.48-1.83-.16-.27-.02-.42.12-.55.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47-.16-.01-.34-.01-.52-.01-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29s.98 2.66 1.12 2.84c.14.18 1.92 2.93 4.65 4.11.65.28 1.16.45 1.55.57.52.21 1.24.18 1.71.11.52-.08 1.58-.65 1.8-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32z"/>

          <path d="M16.01 3C8.83 3 3 8.83 3 16.01c0 2.29.6 4.44 1.65 6.3L3 29l6.86-1.6a12.95 12.95 0 0 0 6.15 1.55h.01C23.18 28.95 29 23.12 29 15.99 29 8.83 23.18 3 16.01 3zm0 23.64h-.01c-1.96 0-3.88-.53-5.56-1.54l-.4-.24-4.07.95.97-3.97-.26-.41a10.94 10.94 0 1 1 9.33 5.21z"/>

        </svg>

      </a>

      <a
        href="cardapio.html"
        class="btn-cardapio"
      >
        VER CARDÁPIO
      </a>

    </div>

  </main>

  <script>

    /* =========================
       MASCOTE
       TENTA LOCAL PRIMEIRO.
       SE FALHAR, USA IMGUR.
    ========================= */

    const mascote = document.getElementById("mascote");

    mascote.onerror = function () {

      /* Evita ficar entrando em loop */
      if (this.dataset.fallback === "1") {
        return;
      }

      this.dataset.fallback = "1";

      this.src = "https://i.imgur.com/lL0PfCJ.png";
    };


    /* =========================
       HORÁRIO
    ========================= */

    const horaAbertura = 18;
    const horaFechamento = 23;

    function atualizarStatus() {

      const agora = new Date();

      const hora = agora.getHours();
      const minuto = agora.getMinutes();

      const horarioAtual =
        hora + (minuto / 60);

      const aberto =
        horarioAtual >= horaAbertura &&
        horarioAtual < horaFechamento;

      const status =
        document.getElementById("status");

      const texto =
        document.getElementById("statusTexto");

      if (aberto) {

        status.classList.remove("fechado");

        texto.textContent = "ABERTO";

      } else {

        status.classList.add("fechado");

        texto.textContent = "FECHADO";

      }
    }

    atualizarStatus();

    setInterval(
      atualizarStatus,
      60000
    );


    /* =========================
       SOM E ACENDER NO CLIQUE
    ========================= */

    function tocarCliqueSistema() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } catch (e) {
        /* Áudio bloqueado pelo navegador, segue sem som */
      }
    }

    // Botões que navegam para outra página: toca o som, acende, depois navega
    document.querySelectorAll(".categoria, .btn-cardapio").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();

        const destino = this.getAttribute("href");

        this.classList.add("clicado");
        tocarCliqueSistema();

        setTimeout(() => {
          window.location.href = destino;
        }, 140);
      });
    });

    // WhatsApp abre em nova aba, só acende e toca o som
    document.querySelector(".btn-whatsapp").addEventListener("click", function () {
      const el = this;

      el.classList.add("clicado");
      tocarCliqueSistema();

      setTimeout(() => {
        el.classList.remove("clicado");
      }, 250);
    });

  </script>

</body>
</html>
