<!DOCTYPE html>
<html lang="pt‑BR">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>🍔 MONSTRO BURGUER — Início</title>
  <style>
    * { margin:0; padding:0; box‑sizing:border‑box; font‑family:Arial, 'Segoe UI', Roboto, sans‑serif; }
    html, body {
      background: #000000;
      color: #ffffff;
      min‑height: 100vh;
      padding‑top: 62px;
      padding‑bottom: 30px;
    }
    :root {
      --roxo: #BF00FF;
      --verde: #00FF41;
      --azul: #00CCFF;
      --fundo‑btn: #120822;
    }

    /* 🟢 STATUS LOJA */
    .status‑box {
      position:fixed; top:12px; left:12px; z‑index:90;
      display:flex; gap:7px; align‑items:center;
      background:rgba(30,30,40,.75); border:1px solid #333;
      border‑radius:50px; padding:6px 16px;
      font‑size: 14px; font‑weight: 500;
      backdrop‑filter: blur(4px);
    }
    .ponto {width: 10px; height: 10px; border‑radius: 50%; background:#555;}
    .aberto .ponto {
      background: var(--verde); box‑shadow: 0 0 9px var(--verde);
      animation: brilhoPonto 2s infinite alternate;
    }
    .fechado .ponto { background:#ff3355; box‑shadow:0 0 9px #ff3355; }
    @keyframes brilhoPonto {0%{opacity:.6}100%{opacity:1}}

    /* ⚙️ ENGRENAGEM ADMIN */
    .botao‑engrenagem {
      position:fixed; top:12px; right:12px; z‑index:99;
      width: 40px; height: 40px; border‑radius: 50%;
      border: 1px solid #444; background:rgba(30,30,40,.75);
      color: #aaa; font‑size: 18px; line‑height: 38px; text‑align:center;
      backdrop‑filter: blur(4px);
      text‑decoration:none; cursor:pointer;
      transition: all .2s ease;
    }
    .botao‑engrenagem:hover {border‑color:var(--roxo); color:var(--roxo);}

    /* 🖼️ ÁREA MASCOTE — PERFEITAMENTE AJUSTADA */
    .bloco‑logo {
      text‑align:center;
      padding: 20px 16px 24px;
    }
    .logo‑marca {
      width: 100%;
      max‑width: 320px;
      height: auto;
      display:block;
      margin: 0 auto;
      object‑fit: contain;
    }
    .slogan {
      color:#999; font‑size: 15px; margin‑top: 6px; letter‑spacing: .5px;
    }
    .titulo‑etapa {
      text‑align:center;
      color:#ccc; font‑size: 16px; letter‑spacing: 1px;
      margin‑bottom: 20px; text‑transform: uppercase;
    }

    /* 🎯 GRADE EXATA: 2 × 2 → Combos no centro embaixo */
    .grade‑botoes {
      max‑width: 520px; margin: 0 auto; padding: 0 16px;
      display:grid;
      grid‑template‑columns: repeat(2, 1fr);
      gap: 16px;
    }
    .botao‑cat {
      border‑radius: 50px; border: 2px solid transparent;
      background: linear-gradient(#1a1a2c, #10101f) padding‑box,
                  linear-gradient(135deg, var(--azul), var(--roxo)) border‑box;
      color:#fff; font‑size: 16px; font‑weight: 500;
      padding: 14px 12px; text‑align:center; cursor:pointer;
      transition: all .22s ease;
    }
    .botao‑cat.ativo {
      border‑color: var(--azul);
      box‑shadow: inset 0 0 0 1px rgba(0,204,255,.15), 0 0 10px rgba(0,204,255,.35);
      background: #1e2638;
    }
    .botao‑cat:hover:not(.ativo) {
      border‑color: #444;
      background: #181828;
    }
    .botao‑cat:active {transform: scale(.97);}

    .botao‑linha‑cheia {
      grid‑column: span 2;
      max‑width: 320px; margin: 4px auto 0;
    }

    /* 📋 RODAPÉ: Botão grande + botão telefone */
    .area‑acao {
      max‑width: 520px; margin: 28px auto 0; padding: 0 16px;
      display:flex; gap: 12px; align‑items:center;
    }
    .botao‑ver {
      flex: 1;
      border‑radius: 50px; border:none;
      background: linear-gradient(90deg, #7B00CC, #BF00FF);
      color:#fff; font‑size: 17px; font‑weight:bold;
      padding: 14px 12px; text‑align:center;
      display:block; text‑decoration:none;
      box‑shadow: 0 0 12px rgba(191,0,255,.28);
      transition: transform .22s ease, filter .22s ease;
    }
    .botao‑ver:hover { filter:brightness(1.08); transform:scale(1.015); }
    .botao‑ver:active {transform: scale(.97);}

    .botao‑tel {
      width: 52px; height: 52px; min‑width: 52px;
      border‑radius: 50%; border:none;
      background: linear-gradient(#142c1c, #0f2015);
      color: var(--verde); font‑size: 22px;
      display:flex; align‑items:center; justify‑content:center;
      box‑shadow: 0 0 0 1px rgba(0,255,65,.2), inset 0 0 6px rgba(0,255,65,.08);
      cursor:pointer; transition: all .2s ease;
      text‑decoration:none;
    }
    .botao‑tel:hover { background:#1a3824; box‑shadow: 0 0 14px rgba(0,255,65,.35); }
  </style>
</head>
<body>

<div class="status‑box fechado">
  <div class="ponto"></div>
  <span id="texto‑status">LOJA FECHADA</span>
</div>

<a class="botao‑engrenagem" href="admin.html">⚙</a>

<!-- 🖼️ LINK DEFINITIVO → JÁ APONTANDO PRO SEU ARQUIVO NO GITHUB -->
<div class="bloco‑logo">
  <img class="logo‑marca" alt="MONSTRO BURGUER — Mascote Oficial"
       src="https://raw.githubusercontent.com/Monstroburguer/Monstro‑Burguer/main/mascote‑oficial.png">
  <p class="slogan">A FOME CHAMOU.</p>
</div>

<p class="titulo‑etapa">ESCOLHA O TAMANHO DA SUA FOME</p>

<div class="grade‑botoes">
  <button class="botao‑cat ativo" onclick="irPara('todos')">🍔 Todos</button>
  <button class="botao‑cat" onclick="irPara('lanches')">🍔 Lanches</button>
  <button class="botao‑cat" onclick="irPara('bebidas')">🥤 Bebidas</button>
  <button class="botao‑cat" onclick="irPara('adicionais')">➕ Adicionais</button>
  <button class="botao‑cat botao‑linha‑cheia" onclick="irPara('combos')">📦 Combos</button>
</div>

<div class="area‑acao">
  <a class="botao‑ver" href="cardapio.html">VER CARDÁPIO</a>
  <a class="botao‑tel" href="https://wa.me/5514996619487" target="_blank">📞</a>
</div>

<script>
function irPara(categoria){
  localStorage.setItem('categoriaInicial', categoria);
  window.location.href = 'cardapio.html';
}
window.onload = function(){
  const caixa=document.querySelector('.status‑box'), txt=document.getElementById('texto‑status'),
        ok=localStorage.getItem('lojaAberta')!=='false';
  caixa.classList.toggle('aberto',ok);
  caixa.classList.toggle('fechado',!ok);
  txt.textContent=ok?'LOJA ABERTA':'LOJA FECHADA';
};
</script>
</body>
</html>
