<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MONSTRO BURGUER</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Segoe UI", sans-serif;
    }

    :root {
      --fundo: #000000;
      --azul-neon: #00f0ff;
      --azul-glow: rgba(0, 240, 255, 0.8);
      --roxo-botao: #130026;
      --branco: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTAINER DO APP COM MOLDURA NEON */
    .app {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: var(--fundo);
      
      /* Moldura azul neon única */
      border: 2px solid var(--azul-neon);
      border-radius: 28px;
      box-shadow: 0 0 15px var(--azul-neon), inset 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* BOTÃO CONFIGURAÇÕES (ADM) */
    .config {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 36px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      border: 1.5px solid var(--azul-neon);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      text-decoration: none;
      font-size: 16px;
      z-index: 20;
      box-shadow: 0 0 8px var(--azul-neon);
    }

    /* AREA DO MASCOTE E LOGO */
    .mascote-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }

    .mascote {
      width: min(65vw, 240px);
      max-height: 200px;
      object-fit: contain;
    }

    .subtitulo {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
    }

    /* BOTÕES DE CATEGORIAS */
    .categorias {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .categoria {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 20px;
      border: 1.5px solid var(--azul-neon);
      background: var(--roxo-botao);
      color: var(--azul-neon);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 0 10px var(--azul-glow);
      text-shadow: 0 0 5px var(--azul-neon);
    }

    /* BOTÃO COMBOS CENTRALIZADO */
    .categoria-combo {
      grid-column: span 2;
      width: 60%;
      justify-self: center;
    }

    /* ÁREA INFERIOR (WHATSAPP + CARDÁPIO) */
    .rodape-acoes {
      width: 100%;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    .btn-whatsapp {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      border: 1.5px solid var(--azul-neon);
      background: var(--roxo-botao);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--azul-glow);
      flex-shrink: 0;
    }

    .btn-whatsapp svg {
      width: 26px;
      height: 26px;
      fill: var(--azul-neon);
      filter: drop-shadow(0 0 3px var(--azul-neon));
    }

    .btn-cardapio {
      flex: 1;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1.5px solid var(--azul-neon);
      background: var(--roxo-botao);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 12px var(--azul-glow);
      text-shadow: 0 0 8px var(--azul-neon);
    }
  </style>
</head>
<body>

  <main class="app">

    <a href="adm.html" class="config" aria-label="Administração">⚙️</a>

    <section class="mascote-area">
      <img src="mascote-monstro.png" alt="Monstro Burguer" class="mascote">
      <div class="subtitulo">O sabor monstruoso que você merece!</div>
    </section>

    <nav class="categorias">
      <a href="cardapio.html" class="categoria">🍔 Todos</a>
      <a href="cardapio.html" class="categoria">🍔 Lanches</a>
      <a href="cardapio.html" class="categoria">🥤 Bebidas</a>
      <a href="cardapio.html" class="categoria">➕ Adicionais</a>
      <a href="cardapio.html" class="categoria categoria-combo">📦 Combos</a>
    </nav>

    <div class="rodape-acoes">
      <a href="https://wa.me/" class="btn-whatsapp" target="_blank" aria-label="WhatsApp">
        <svg viewBox="0 0 32 32">
          <path d="M19.11 17.42c-.27-.14-1.58-.78-1.83-.87-.25-.09-.43-.14-.61.14-.18.27-.7.87-.86 1.05-.16.18-.32.2-.59.07-.27-.14-1.12-.41-2.14-1.32-.79-.7-1.32-1.56-1.48-1.83-.16-.27-.02-.42.12-.55.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47-.16-.01-.34-.01-.52-.01-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29s.98 2.66 1.12 2.84c.14.18 1.92 2.93 4.65 4.11.65.28 1.16.45 1.55.57.65.21 1.24.18 1.71.11.52-.08 1.58-.65 1.8-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32z"/>
          <path d="M16.01 3C8.83 3 3 8.83 3 16.01c0 2.29.6 4.44 1.65 6.3L3 29l6.86-1.6a12.95 12.95 0 0 0 6.15 1.55h.01C23.18 28.95 29 23.12 29 15.99 29 8.83 23.18 3 16.01 3zm0 23.64h-.01c-1.96 0-3.88-.53-5.56-1.54l-.4-.24-4.07.95.97-3.97-.26-.41a10.94 10.94 0 1 1 9.33 5.21z"/>
        </svg>
      </a>

      <a href="cardapio.html" class="btn-cardapio">
        VER CARDÁPIO
      </a>
    </div>

  </main>

</body>
</html>
