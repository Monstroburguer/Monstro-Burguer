<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 MONSTRO BURGUER — Administrador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{
  --roxo: #bf00ff;
  --verde: #00ff88;
  --azul: #00ccff;
  --fundo: #000000;
  --card: #1a1a2e;
  --texto: #ffffff;
  --vermelho: #ff3333;
}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding:20px}
h1{text-align:center;color:var(--roxo);text-shadow:0 0 15px var(--roxo);margin-bottom:30px;font-size:26px}
h2{color:var(--azul);margin:20px 0 10px 0;font-size:18px;border-bottom:1px solid #333;padding-bottom:5px}
.secao{background:var(--card);padding:20px;border-radius:16px;margin-bottom:25px;box-shadow:0 0 10px rgba(191,0,255,0.2)}
button{background:linear-gradient(90deg,var(--roxo),var(--azul));color:white;border:none;padding:12px 20px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.3s;margin:5px;box-shadow:0 0 8px var(--roxo)}
button:hover{transform:scale(1.05);box-shadow:0 0 20px var(--azul)}
button.verde{background:linear-gradient(90deg,#00aa66,var(--verde));box-shadow:0 0 8px var(--verde)}
button.vermelho{background:linear-gradient(90deg,#aa0000,var(--vermelho));box-shadow:0 0 8px var(--vermelho)}
button.ativo{box-shadow:0 0 20px var(--verde);transform:scale(1.05)}
input,select{width:100%;padding:12px;margin:8px 0;background:#222;border:1px solid #444;border-radius:10px;color:white;font-size:16px}

/* ✅ 4 BOTÕES ALINHADOS PERFEITAMENTE — TODOS IGUAIS! */
.status-botoes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:15px 0}
.status-botoes button{width:100%;padding:15px 8px;font-size:14px;border-radius:12px;margin:0}

.pedidos-container{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:15px}
.caixa-status{background:#222;padding:15px;border-radius:12px;min-height:120px}
.caixa-status h3{font-size:14px;margin-bottom:10px;text-align:center}
.pedido{background:#333;padding:10px;border-radius:8px;margin:8px 0;font-size:13px;cursor:pointer;transition:all 0.2s}
.pedido:hover{background:#444;transform:scale(1.02)}
.aberto-fechado{text-align:center;margin:20px 0}
.botao-grande{font-size:22px;padding:20px 40px;border-radius:16px;width:100%}
.aberto{background:linear-gradient(90deg,#00aa44,var(--verde));box-shadow:0 0 15px var(--verde)}
.fechado{background:linear-gradient(90deg,#aa0000,var(--vermelho));box-shadow:0 0 15px var(--vermelho)}
.voltar{display:block;text-align:center;color:var(--azul);margin-top:30px;text-decoration:none;font-size:18px}
.voltar:hover{color:var(--roxo)}
</style>
</head>
<body>

<!-- 🔒 SISTEMA DE SENHA -->
<script>
const SENHA_CORRETA = "monstro123"; // 🔑 TROCA ESSA SENHA!

function verificarSenha(){
  const senha = prompt("🔒 ÁREA RESTRITA — Digite a senha:");
  if(senha === SENHA_CORRETA){
    document.getElementById("painel").style.display = "block";
    carregarPedidos();
  }else{
    alert("❌ Senha incorreta! Acesso negado!");
    window.location.href = "index.html";
  }
}
</script>

<div id="painel" style="display:none;">
<h1>🔒 MONSTRO BURGUER — ADMINISTRAÇÃO</h1>

<!-- ✅ ABRIR / FECHAR LOJA -->
<div class="secao">
  <h2>🏪 CONTROLE DA LOJA</h2>
  <div class="aberto-fechado">
    <button id="botao-loja" class="botao-grande aberto" onclick="trocarStatus()">
      ✅ LOJA ABERTA
    </button>
  </div>
</div>

<!-- 🎨 PERSONALIZAÇÃO DA MARCA -->
<div class="secao">
  <h2>🎨 PERSONALIZAÇÃO DA MARCA</h2>
  <label>Link da Logo:</label>
  <input type="text" id="link-logo" placeholder="Cole o link da logo aqui...">
  <button class="verde" onclick="salvarLogo()">💾 Salvar Logo</button>

  <label>Link do Mascote:</label>
  <input type="text" id="link-mascote" placeholder="Cole o link do mascote aqui...">
  <button class="verde" onclick="salvarMascote()">💾 Salvar Mascote</button>

  <label>Link do Banner:</label>
  <input type="text" id="link-banner" placeholder="Cole o link do banner aqui...">
  <button class="verde" onclick="salvarBanner()">💾 Salvar Banner</button>
</div>

<!-- 📋 PEDIDOS — BOTÕES ALINHADOS E FUNCIONANDO! -->
<div class="secao">
  <h2>📋 CONTROLE DE PEDIDOS</h2>
  
  <!-- ✅ 4 BOTÕES ALINHADOS PERFEITAMENTE — TODOS MESMO TAMANHO! -->
  <div class="status-botoes">
    <button class="verde" onclick="mudarStatusTodos('novo')">🆕 NOVO</button>
    <button onclick="mudarStatusTodos('preparando')">🔥 PREPARANDO</button>
    <button onclick="mudarStatusTodos('pronto')">✅ PRONTO</button>
    <button class="verde" onclick="mudarStatusTodos('entregue')">🚀 ENTREGUE</button>
  </div>

  <!-- ✅ CAIXAS DOS PEDIDOS -->
  <div class="pedidos-container">
    <div class="caixa-status">
      <h3>🆕 NOVO</h3>
      <div id="pedidos-novo"></div>
    </div>
    <div class="caixa-status">
      <h3>🔥 PREPARANDO</h3>
      <div id="pedidos-preparando"></div>
    </div>
    <div class="caixa-status">
      <h3>✅ PRONTO</h3>
      <div id="pedidos-pronto"></div>
    </div>
    <div class="caixa-status">
      <h3>🚀 ENTREGUE</h3>
      <div id="pedidos-entregue"></div>
    </div>
  </div>
</div>

<!-- 🍽️ GERENCIAR CARDÁPIO -->
<div class="secao">
  <h2>🍽️ GERENCIAR CARDÁPIO</h2>
  <label>Nome do Item:</label>
  <input type="text" id="item-nome" placeholder="Ex: X-Burguer Monstro">
  <label>Preço R$:</label>
  <input type="number" step="0.01" id="item-preco" placeholder="0.00">
  <label>Categoria:</label>
  <select id="item-categoria">
    <option value="lanches">🍔 Lanches</option>
    <option value="bebidas">🥤 Bebidas</option>
    <option value="adicionais">➕ Adicionais</option>
    <option value="combos">📦 Combos</option>
  </select>
  <button class="verde" onclick="adicionarItem()">➕ Adicionar Item</button>
  <div id="lista-itens" style="margin-top:20px;"></div>
</div>

<a href="index.html" class="voltar">← Voltar para a Página Inicial</a>
</div>

<script>
// 🏪 STATUS DA LOJA
let lojaAberta = localStorage.getItem("lojaAberta") !== "false";
atualizarBotaoLoja();

function trocarStatus(){
  lojaAberta = !lojaAberta;
  localStorage.setItem("lojaAberta", lojaAberta);
  atualizarBotaoLoja();
}
function atualizarBotaoLoja(){
  const botao = document.getElementById("botao-loja");
  if(lojaAberta){
    botao.className = "botao-grande aberto";
    botao.innerHTML = "✅ LOJA ABERTA";
  }else{
    botao.className = "botao-grande fechado";
    botao.innerHTML = "❌ LOJA FECHADA";
  }
}

// 🎨 PERSONALIZAÇÃO
function salvarLogo(){
  const link = document.getElementById("link-logo").value;
  localStorage.setItem("logoPersonalizada", link);
  alert("✅ Logo salva! Atualize a página inicial!");
}
function salvarMascote(){
  const link = document.getElementById("link-mascote").value;
  localStorage.setItem("mascotePersonalizado", link);
  alert("✅ Mascote salvo! Atualize a página inicial!");
}
function salvarBanner(){
  const link = document.getElementById("link-banner").value;
  localStorage.setItem("bannerPersonalizado", link);
  alert("✅ Banner salvo! Atualize a página inicial!");
}

// 📋 PEDIDOS — FUNÇÃO REAL!
function carregarPedidos(){
  const pedidos = JSON.parse(localStorage.getItem("pedidosMonstro") || "[]");
  const status = ['novo', 'preparando', 'pronto', 'entregue'];
  const ids = {
    novo: 'pedidos-novo',
    preparando: 'pedidos-preparando',
    pronto: 'pedidos-pronto',
    entregue: 'pedidos-entregue'
  };
  
  status.forEach(s => {
    const div = document.getElementById(ids[s]);
    div.innerHTML = '';
    pedidos.filter(p => p.status === s).forEach((pedido, indice) => {
      const idxReal = pedidos.indexOf(pedido);
      div.innerHTML += `
        <div class="pedido" onclick="avancarPedido(${idxReal})">
          <strong>#${pedido.id}</strong><br>
          ${pedido.itens}<br>
          <small>R$ ${pedido.total.toFixed(2)}</small>
        </div>
      `;
    });
  });
}

function avancarPedido(indice){
  const pedidos = JSON.parse(localStorage.getItem("pedidosMonstro") || "[]");
  const ordem = ['novo', 'preparando', 'pronto', 'entregue'];
  const atual = ordem.indexOf(pedidos[indice].status);
  if(atual < ordem.length - 1){
    pedidos[indice].status = ordem[atual + 1];
    localStorage.setItem("pedidosMonstro", JSON.stringify(pedidos));
    carregarPedidos();
  }
}

function mudarStatusTodos(novoStatus){
  if(!confirm("Mudar todos os pedidos para essa etapa?")) return;
  const pedidos = JSON.parse(localStorage.getItem("pedidosMonstro") || "[]");
  pedidos.forEach(p => p.status = novoStatus);
  localStorage.setItem("pedidosMonstro", JSON.stringify(pedidos));
  carregarPedidos();
}

// 🍽️ GERENCIAR ITENS
function adicionarItem(){
  const nome = document.getElementById("item-nome").value;
  const preco = document.getElementById("item-preco").value;
  const cat = document.getElementById("item-categoria").value;
  if(!nome || !preco){ alert("❌ Preencha nome e preço!"); return; }
  
  const itens = JSON.parse(localStorage.getItem("cardapioItens") || "[]");
  itens.push({nome, preco: parseFloat(preco), categoria: cat, id: Date.now()});
  localStorage.setItem("cardapioItens", JSON.stringify(itens));
  
  document.getElementById("item-nome").value = "";
  document.getElementById("item-preco").value = "";
  alert("✅ Item adicionado ao cardápio!");
  listarItens();
}

function listarItens(){
  const itens = JSON.parse(localStorage.getItem("cardapioItens") || "[]");
  const div = document.getElementById("lista-itens");
  div.innerHTML = "<h3>Itens Cadastrados:</h3>";
  itens.forEach((item, indice)=>{
    div.innerHTML += `
      <div style="background:#222;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center">
        <span><strong>${item.nome}</strong> — R$ ${item.preco.toFixed(2)}</span>
        <button class="vermelho" onclick="excluirItem(${indice})" style="padding:5px 10px">🗑️</button>
      </div>
    `;
  });
}
function excluirItem(indice){
  if(!confirm("Tem certeza que quer excluir?")) return;
  const itens = JSON.parse(localStorage.getItem("cardapioItens") || "[]");
  itens.splice(indice, 1);
  localStorage.setItem("cardapioItens", JSON.stringify(itens));
  listarItens();
}

// Iniciar
listarItens();
</script>

<script>verificarSenha();</script>
</body>
</html>
